<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAZO TYCOON — Business Empire V6</title>
<style>
*{box-sizing:border-box} :root{--g:#e8bd58;--g2:#ffe5a0;--bg:#030a10;--p:#071722;--p2:#0d2734;--t:#f2f7f9;--m:#9bb0ba;--ok:#66e39a;--bad:#ff8080}
html,body{margin:0;background:#02070b;color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.game{min-height:100vh;max-width:1600px;margin:auto;background:#06131c}.top{height:62px;display:flex;align-items:center;gap:8px;padding:8px 13px;background:#05111a;border-bottom:1px solid #84672e;position:sticky;top:0;z-index:30}.logo{font-weight:950;color:var(--g2);font-size:20px}.logo small{display:block;font-size:8px;letter-spacing:3px;color:#9caeb7}.hud{margin-left:auto;display:flex;gap:6px}.chip{background:#0a202c;border:1px solid #405763;border-radius:9px;padding:8px 10px;font-size:12px}.chip b{color:var(--g2)}.danger{border-color:#7c4242;color:#ffc0c0}
.body{display:grid;grid-template-columns:70px 1fr}.rail{background:#061722;border-right:1px solid #80632d;padding:8px 7px;display:flex;flex-direction:column;gap:8px}.rail button{height:54px;border:1px solid #67542c;background:#0b2230;border-radius:10px;font-size:22px;position:relative}.rail button:hover,.rail button.on{border-color:var(--g2);background:#5d4318}.rail button em{display:none;position:absolute;left:62px;top:8px;z-index:50;font-style:normal;font-size:11px;white-space:nowrap;background:#06131eee;border:1px solid #80652f;border-radius:7px;padding:8px}.rail button:hover em{display:block}
main{min-width:0}.companybar{display:flex;align-items:center;gap:10px;padding:10px 12px}.companybar h1{margin:0;color:var(--g2);font-size:23px}.companybar p{margin:2px 0;color:var(--m);font-size:12px}.companybar .right{margin-left:auto}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:0 12px 8px}.stat{background:#091f2b;border:1px solid #294551;border-radius:9px;padding:8px}.stat small{display:block;color:var(--m);font-size:10px}.stat b{display:block;color:var(--g2);font-size:13px;margin-top:3px}
.world{height:500px;margin:0 12px;position:relative;overflow:hidden;border:1px solid #8d6e30;border-radius:14px;background:#102c3d}.world.textile{background:url('textile-campus.png') center/cover no-repeat}.sky{position:absolute;inset:0;background:linear-gradient(#3e6f8e 0,#7996a3 45%,#273c45 46%,#0a161c 100%)}.textile .sky,.textile .sceneobj{display:none}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#020b12d9 0,transparent 30%),linear-gradient(90deg,#020b1290 0,transparent 25%,transparent 75%,#020b1260);pointer-events:none}
.sceneobj{position:absolute;z-index:1}.ground{left:0;right:0;bottom:0;height:48%;background:linear-gradient(#3e4a42,#1d2826)}.road{left:-5%;right:-5%;bottom:8%;height:18%;background:#263036;transform:skewY(-2deg);border-top:4px solid #8c8f87}.building{left:24%;bottom:27%;width:52%;height:47%;background:linear-gradient(90deg,#162d38,#536c77,#19313c);border:2px solid #8999a0;border-radius:8px 8px 0 0;box-shadow:0 20px 45px #0008}.building:before{content:"";position:absolute;inset:14px;background-image:linear-gradient(#ffd96d55 1px,transparent 1px),linear-gradient(90deg,#ffd96d44 1px,transparent 1px);background-size:36px 28px}.building .brandname{position:absolute;z-index:2;left:0;right:0;top:38%;text-align:center;font-size:30px;font-weight:950;color:var(--g2);text-shadow:0 3px 8px #000}
.decor{position:absolute;bottom:23%;font-size:55px;filter:drop-shadow(0 6px 5px #0008)}.d1{left:12%}.d2{right:11%}.d3{right:31%;bottom:13%;font-size:42px}
.scenehud{position:absolute;z-index:5;left:13px;top:13px;background:#05131ddd;border:1px solid #927334;border-radius:10px;padding:10px;backdrop-filter:blur(7px)}.scenehud b{color:var(--g2)}.hot{position:absolute;z-index:5;border:1px solid var(--g);background:#06131ddd;border-radius:9px;padding:8px 10px;font-weight:850;box-shadow:0 7px 20px #0008}.hot small{display:block;font-size:9px;color:#b6c4ca;font-weight:400}.office{left:28%;top:48%}.production{right:25%;top:46%}.warehouse{right:12%;top:65%}.sales{left:46%;top:69%}
.quick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:8px 12px}.quick button,.companies button,.action{border:1px solid #66532d;background:linear-gradient(145deg,#091b26,#102a38);border-radius:9px;padding:9px}.quick button{text-align:center}.quick span{display:block;font-size:20px}.quick small{display:block;color:var(--m);font-size:9px}.quick button:hover{border-color:var(--g2)}
.companystrip{border-top:1px solid #80632d;padding:8px 12px}.striptitle{display:flex;justify-content:space-between;margin-bottom:6px}.striptitle b{color:var(--g2)}.striptitle span{color:var(--m);font-size:10px}.companies{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.companies button{text-align:left}.companies button.on{border-color:var(--g2);background:#594017}.companies i{font-style:normal;font-size:19px}.companies b{display:block;font-size:11px}.companies small{font-size:9px;color:var(--m)}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:90;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalbox{width:min(920px,100%);max-height:88vh;overflow:auto;background:#081e2a;border:1px solid #9a7934;border-radius:15px;padding:15px}.close{float:right;border:1px solid #506773;background:#142d39;border-radius:8px;padding:7px 10px}.modal h2{margin:0;color:var(--g2)}.desc{color:var(--m);font-size:12px;margin:4px 0 12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{background:#061720;border:1px solid #294551;border-radius:10px;padding:11px}.panel h3{margin:0 0 8px;color:var(--g2)}.row{display:flex;justify-content:space-between;gap:10px;padding:8px;border-bottom:1px solid #1c3540}.row:last-child{border:0}.form{display:grid;grid-template-columns:1fr 90px auto;gap:7px;margin-top:9px}.form input,.form select{min-width:0;background:#04121a;border:1px solid #435a65;border-radius:8px;padding:9px}.action{font-weight:800;color:#fff0b8}.action:hover{border-color:var(--g2)}.log{max-height:230px;overflow:auto}.log div{font-size:11px;padding:6px;border-bottom:1px solid #1a323d}.toast{display:none;position:fixed;right:14px;bottom:14px;z-index:110;background:#0e2a38;border:1px solid #9d7c37;border-radius:9px;padding:10px 13px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.quick{grid-template-columns:repeat(4,1fr)}.companies{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.top{height:auto;flex-wrap:wrap}.hud{margin-left:0;flex-wrap:wrap}.body{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid #80632d;display:grid;grid-template-columns:repeat(5,1fr)}.rail button{height:42px;font-size:17px}.companybar h1{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.world{height:410px}.quick{grid-template-columns:repeat(2,1fr)}.companies{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.form{grid-template-columns:1fr 80px}.form .action{grid-column:1/-1}.hot{font-size:10px}.office{left:20%;top:50%}.production{right:13%;top:48%}.warehouse{right:7%;top:66%}.sales{left:38%;top:70%}}
</style></head><body><div class="game">
<header class="top"><div class="logo">♛ ZAZO TYCOON<small>BUSINESS EMPIRE — V6</small></div><div class="hud"><div class="chip">Holding <b id="holding"></b></div><div class="chip">Grup <b id="group"></b></div><div class="chip">Gün <b id="day"></b></div><button class="chip danger" id="reset">↻ Sıfırla</button></div></header>
<div class="body"><aside class="rail" id="rail"></aside><main>
<div class="companybar"><div><h1 id="cname"></h1><p id="csub"></p></div><div class="right chip">👔 <b id="managerTop"></b> &nbsp; 🌍 <b id="exportTop"></b></div></div><div class="stats" id="stats"></div>
<section class="world textile" id="world"><div class="sky"></div><div class="sceneobj ground"></div><div class="sceneobj road"></div><div class="sceneobj building"><div class="brandname" id="brandname"></div></div><div class="sceneobj decor d1" id="d1"></div><div class="sceneobj decor d2" id="d2"></div><div class="sceneobj decor d3" id="d3"></div><div class="scenehud"><b id="sceneTitle"></b><div id="sceneLine"></div></div>
<button class="hot office" data-area="office">🏢 OFİS<small>Şirket merkezi</small></button><button class="hot production" data-area="production">🏭 ÜRETİM<small id="prodLabel"></small></button><button class="hot warehouse" data-area="warehouse">📦 DEPO<small>Stok & sevkiyat</small></button><button class="hot sales" data-area="sales">🏪 SATIŞ<small id="salesLabel"></small></button></section>
<div class="quick" id="quick"></div></main></div>
<section class="companystrip"><div class="striptitle"><b>ŞİRKETLERİM</b><span>Her şirketin kendi üretim ve satış ekonomisi çalışır</span></div><div class="companies" id="companies"></div></section></div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" id="close">✕</button><h2 id="mt"></h2><div class="desc" id="md"></div><div id="mb"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='zazoRealGameV6';
const SECTORS=[
{name:'ZAZO TEKSTİL',sector:'Tekstil',icon:'🧵',decor:['🧵','🚚','🏭'],raw:'Pamuk',product:'Tişört',unit:'adet',buy:45,make:35,sell:190},
{name:'ZAZO İNŞAAT',sector:'İnşaat',icon:'🏗️',decor:['🏗️','🚜','🏢'],raw:'İnşaat Malzemesi',product:'Konut Projesi',unit:'proje',buy:2200000,make:1800000,sell:6500000},
{name:'ZAZO GIDA',sector:'Gıda',icon:'🥫',decor:['🌾','🚚','🥫'],raw:'Gıda Hammaddesi',product:'Gıda Paketi',unit:'koli',buy:80,make:45,sell:260},
{name:'ZAZO OTOMOTİV',sector:'Otomotiv',icon:'🚗',decor:['🚗','🚛','🏭'],raw:'Parça Seti',product:'Otomobil',unit:'araç',buy:480000,make:220000,sell:1150000},
{name:'ZAZO TEKNOLOJİ',sector:'Teknoloji',icon:'💻',decor:['💻','📱','🤖'],raw:'Elektronik Parça',product:'Akıllı Cihaz',unit:'cihaz',buy:4200,make:2600,sell:12900},
{name:'ZAZO LOJİSTİK',sector:'Lojistik',icon:'🚚',decor:['🚚','🚛','📦'],raw:'Yakıt & Operasyon',product:'Taşıma Hizmeti',unit:'sefer',buy:6200,make:2400,sell:14500},
{name:'ZAZO HAVACILIK',sector:'Havacılık',icon:'✈️',decor:['✈️','🛫','🏢'],raw:'Uçuş Operasyonu',product:'Yolcu Uçuşu',unit:'uçuş',buy:185000,make:95000,sell:520000},
{name:'ZAZO UZAY',sector:'Uzay',icon:'🚀',decor:['🚀','🛰️','🌌'],raw:'Roket Bileşeni',product:'Uydu Görevi',unit:'görev',buy:4800000,make:3200000,sell:13500000},
{name:'ZAZO ENERJİ',sector:'Enerji',icon:'⚡',decor:['⚡','🔋','🏭'],raw:'Enerji Kaynağı',product:'Enerji Paketi',unit:'MWh',buy:950,make:450,sell:2600},
{name:'ZAZO MADENCİLİK',sector:'Madencilik',icon:'⛏️',decor:['⛏️','🚜','🪨'],raw:'Saha Operasyonu',product:'İşlenmiş Maden',unit:'ton',buy:1450,make:900,sell:4200}
];
function fresh(){return{holding:25000000,day:1,current:0,debt:0,deposit:0,portfolio:{gold:0,stock:0,crypto:0},companies:SECTORS.map((s,i)=>({name:s.name,sector:s.sector,icon:s.icon,cash:i===0?2500000:1200000,value:5000000+i*750000,level:1,staff:8,manager:false,raw:0,warehouse:0,shop:0,vehicles:1,stores:1,totalSales:0,totalCosts:0,holdingPaid:0,logs:[]}))}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const c=()=>S.companies[S.current],def=()=>SECTORS[S.current],money=n=>'₺'+Math.round(Number(n)||0).toLocaleString('tr-TR'),save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.zz);window.zz=setTimeout(()=>e.style.display='none',1900)}
function rows(a){return a.map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function modal(t,d,b){mt.textContent=t;md.textContent=d||'';mb.innerHTML=b;document.querySelector('#modal').classList.add('open')}
const navs=[['🏙️','Şehir'],['🏢','Şirketler'],['🏦','Banka'],['📈','Yatırım'],['🛒','Pazar'],['🚚','Araçlar'],['♛','Holding'],['📊','Rapor'],['🏆','Başarı'],['⚙️','Ayarlar']];
rail.innerHTML=navs.map((n,i)=>'<button data-nav="'+i+'" class="'+(i===1?'on':'')+'">'+n[0]+'<em>'+n[1]+'</em></button>').join('');
const quicks=[['🏢','Ofis','office'],['🏭','Üretim','production'],['📦','Depo','warehouse'],['🏪','Satış','sales'],['👥','Çalışan','staff'],['🚚','Filo','fleet'],['📊','Muhasebe','accounting'],['⬆️','Geliştir','upgrade']];
function render(){let x=c(),d=def();holding.textContent=money(S.holding);group.textContent=money(S.companies.reduce((a,b)=>a+b.value,0));day.textContent=S.day;cname.textContent=x.name;csub.textContent=d.sector+' • Seviye '+x.level+' • '+(x.level>=5?'AŞ':x.level>=3?'LTD':'Şahıs Şirketi');managerTop.textContent=x.manager?'Müdür Aktif':'Müdür Yok';exportTop.textContent=x.level>=4?(x.level*3)+' ülke':'İç Pazar';sceneTitle.textContent=x.name;sceneLine.textContent=d.sector+' operasyon kampüsü';brandname.textContent=x.name;d1.textContent=d.decor[0];d2.textContent=d.decor[1];d3.textContent=d.decor[2];prodLabel.textContent=d.product+' üret';salesLabel.textContent=d.product+' sat';world.className='world '+(S.current===0?'textile':'');
let net=x.totalSales-x.totalCosts;stats.innerHTML=[['Şirket Değeri',money(x.value)],['Şirket Kasası',money(x.cash)],['Hammadde',x.raw+' '+d.unit],['Depo',x.warehouse+' '+d.unit],['Satış Stoğu',x.shop+' '+d.unit],['Gerçek Net',money(net)]].map(a=>'<div class="stat"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join('');
quick.innerHTML=quicks.map(q=>'<button data-q="'+q[2]+'"><span>'+q[0]+'</span><b>'+q[1]+'</b><small>Yönet</small></button>').join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openArea(b.dataset.q));
companies.innerHTML=S.companies.map((q,i)=>'<button data-c="'+i+'" class="'+(i===S.current?'on':'')+'"><i>'+q.icon+'</i><b>'+q.name+'</b><small>Sv.'+q.level+' • '+money(q.cash)+'</small></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.current=+b.dataset.c;save();render();toast(c().name+' kampüsüne girdin')})}
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>openArea(b.dataset.area));
function openArea(a){let x=c(),d=def();if(a==='office')return office();if(a==='production')return production();if(a==='warehouse')return warehouse();if(a==='sales')return sales();if(a==='staff')return staff();if(a==='fleet')return fleet();if(a==='accounting')return accounting();if(a==='upgrade')return upgrade()}
function office(){let x=c();modal('🏢 '+x.name+' — MERKEZ OFİS','Şirketin ana yönetim merkezi.',rows([['Şirket Seviyesi',x.level],['Hukuki Yapı',x.level>=5?'AŞ':x.level>=3?'LTD':'Şahıs Şirketi'],['Çalışan',x.staff],['Müdür',x.manager?'Aktif':'Yok'],['Şirket Değeri',money(x.value)],['Kasa',money(x.cash)]])+'<button class="action" id="mgr">'+(x.manager?'Müdür Otomasyonunu Kapat':'Müdür İşe Al — '+money(150000))+'</button>');setTimeout(()=>{mgr.onclick=()=>{if(!x.manager&&x.cash<150000)return toast('Kasa yetersiz');if(!x.manager)x.cash-=150000;x.manager=!x.manager;x.logs.push('Gün '+S.day+' • Müdür '+(x.manager?'işe alındı':'kapatıldı'));save();render();office()}},0)}
function production(){let x=c(),d=def();modal('🏭 '+x.name+' — '+(d.sector==='İnşaat'?'ŞANTİYE':'ÜRETİM TESİSİ'),d.raw+' satın al, '+d.product+' üret.','<div class="cols"><div class="panel"><h3>Hammadde / Operasyon</h3>'+rows([[d.raw,money(d.buy)+' / birim'],['Mevcut',x.raw+' birim']])+'<div class="form"><input value="'+d.raw+'" disabled><input id="bq" type="number" min="1" value="10"><button class="action" id="buy">Satın Al</button></div></div><div class="panel"><h3>'+d.product+' Üretimi</h3>'+rows([['Gerekli','1 '+d.raw],['Ek Üretim Maliyeti',money(d.make)],['Depodaki Ürün',x.warehouse+' '+d.unit]])+'<div class="form"><input value="'+d.product+'" disabled><input id="pq" type="number" min="1" value="5"><button class="action" id="make">Üret</button></div></div></div>');setTimeout(bindProduction,0)}
function bindProduction(){let x=c(),d=def();buy.onclick=()=>{let q=Math.max(1,Math.floor(+bq.value||0)),cost=d.buy*q;if(x.cash<cost)return toast('Şirket kasası yetersiz');x.cash-=cost;x.raw+=q;x.totalCosts+=cost;x.logs.push('Gün '+S.day+' • '+q+' '+d.raw+' alındı • '+money(cost));save();render();production()};make.onclick=()=>{let q=Math.max(1,Math.floor(+pq.value||0));if(x.raw<q)return toast(d.raw+' yetersiz');let cost=d.make*q;if(x.cash<cost)return toast('Üretim için kasa yetersiz');x.raw-=q;x.cash-=cost;x.totalCosts+=cost;x.warehouse+=q;x.logs.push('Gün '+S.day+' • '+q+' '+d.product+' üretildi • '+money(cost));save();render();production()}}
function warehouse(){let x=c(),d=def();modal('📦 '+x.name+' — DEPO & SEVKİYAT','Üretilen '+d.product+' satış noktasına sevk edilir.','<div class="cols"><div class="panel"><h3>Depo</h3>'+rows([[d.product,x.warehouse+' '+d.unit],['Satış Noktası',x.shop+' '+d.unit],['Araç',x.vehicles]])+'</div><div class="panel"><h3>Sevkiyat</h3><div class="form"><input value="'+d.product+'" disabled><input id="sq" type="number" min="1" value="5"><button class="action" id="ship">Sevk Et</button></div><div class="desc">Sevkiyat maliyeti: '+money(Math.max(100,d.sell*.01))+' / birim</div></div></div>');setTimeout(()=>{ship.onclick=()=>{let q=Math.max(1,Math.floor(+sq.value||0));if(x.warehouse<q)return toast('Depoda yeterli ürün yok');let cost=Math.max(100,d.sell*.01)*q;if(x.cash<cost)return toast('Kasa yetersiz');x.warehouse-=q;x.shop+=q;x.cash-=cost;x.totalCosts+=cost;x.logs.push('Gün '+S.day+' • '+q+' '+d.product+' sevk edildi');save();render();warehouse()}},0)}
function sales(){let x=c(),d=def();modal('🏪 '+x.name+' — SATIŞ MERKEZİ',d.product+' gerçek satış stoğundan satılır.','<div class="cols"><div class="panel"><h3>Satış Noktası</h3>'+rows([['Ürün',d.product],['Stok',x.shop+' '+d.unit],['Birim Satış',money(d.sell)],['Mağaza/Tesis',x.stores]])+'</div><div class="panel"><h3>Satış Yap</h3><div class="form"><input value="'+d.product+'" disabled><input id="sellq" type="number" min="1" value="3"><button class="action" id="sell">Sat</button></div></div></div>');setTimeout(()=>{sell.onclick=()=>{let q=Math.min(Math.max(1,Math.floor(+sellq.value||0)),x.shop);if(!q)return toast('Satış stoğu yok');let rev=d.sell*q,unitProfit=Math.max(0,d.sell-d.buy-d.make-Math.max(100,d.sell*.01)),profit=unitProfit*q,hold=Math.round(profit*.2);x.shop-=q;x.cash+=rev-hold;S.holding+=hold;x.totalSales+=rev;x.holdingPaid+=hold;x.value+=Math.round(profit*.03);x.logs.push('Gün '+S.day+' • '+q+' '+d.product+' satıldı • '+money(rev)+' • Holding '+money(hold));save();render();sales();toast('Satış tamamlandı')}},0)}
function staff(){let x=c();modal('👥 '+x.name+' — ÇALIŞANLAR','Personel şirket kapasitesini ve otomasyonu etkiler.',rows([['Çalışan',x.staff],['Müdür',x.manager?'Aktif':'Yok'],['Günlük Personel Gideri',money(x.staff*850)]])+'<button class="action" id="hire">+ 5 Çalışan Al — '+money(75000)+'</button>');setTimeout(()=>{hire.onclick=()=>{if(x.cash<75000)return toast('Kasa yetersiz');x.cash-=75000;x.totalCosts+=75000;x.staff+=5;x.value+=100000;save();render();staff()}},0)}
function fleet(){let x=c();modal('🚚 '+x.name+' — FİLO','Taşıma kapasitesini artır.',rows([['Araç',x.vehicles],['Aktif Araç',x.vehicles],['Filo Değeri',money(x.vehicles*650000)]])+'<button class="action" id="vehicle">Yeni Araç Al — '+money(650000)+'</button>');setTimeout(()=>{vehicle.onclick=()=>{if(x.cash<650000)return toast('Kasa yetersiz');x.cash-=650000;x.totalCosts+=650000;x.vehicles++;x.value+=700000;save();render();fleet()}},0)}
function accounting(){let x=c();modal('📊 '+x.name+' — MUHASEBE','Sadece gerçek oyun işlemlerinden oluşan finans kaydı.','<div class="cols"><div class="panel"><h3>Finans</h3>'+rows([['Satış Geliri',money(x.totalSales)],['Toplam Gider',money(x.totalCosts)],['Gerçek Net',money(x.totalSales-x.totalCosts)],['Holding Payı',money(x.holdingPaid)],['Kasa',money(x.cash)]])+'</div><div class="panel"><h3>Hareketler</h3><div class="log">'+(x.logs.length?x.logs.slice().reverse().map(l=>'<div>'+l+'</div>').join(''):'Henüz işlem yok.')+'</div></div></div>')}
function upgrade(){let x=c(),cost=x.level*1200000;modal('⬆️ '+x.name+' — ŞİRKETİ GELİŞTİR','Seviye yükseldikçe şirket tipi, bina ve kapasite büyür.',rows([['Mevcut Seviye',x.level],['Sonraki Seviye',x.level+1],['Yükseltme Maliyeti',money(cost)],['Yeni Hukuki Yapı',x.level+1>=5?'AŞ':x.level+1>=3?'LTD':'Şahıs Şirketi']])+'<button class="action" id="up">Yükselt</button>');setTimeout(()=>{up.onclick=()=>{if(x.cash<cost)return toast('Şirket kasası yetersiz');x.cash-=cost;x.totalCosts+=cost;x.level++;x.value+=Math.round(cost*1.4);x.staff+=3;x.logs.push('Gün '+S.day+' • Şirket seviye '+x.level+' oldu');save();render();document.querySelector('#modal').classList.remove('open');toast('Şirket büyüdü!')}},0)}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(z=>z.classList.remove('on'));b.classList.add('on');let i=+b.dataset.nav;if(i===0)return modal('🏙️ ZAZO ŞEHRİ','İmparatorluğunun ana merkezi.',rows([['Şirket',S.companies.length],['Grup Değeri',money(S.companies.reduce((a,b)=>a+b.value,0))],['Holding Sermayesi',money(S.holding)],['Toplam Çalışan',S.companies.reduce((a,b)=>a+b.staff,0)]]));if(i===1)return toast('Aşağıdan şirket seç');if(i===2)return bank();if(i===3)return investment();if(i===4)return production();if(i===5)return fleet();if(i===6)return holdingPanel();if(i===7)return groupReport();if(i===8)return achievements();return settings()});
function bank(){let x=c(),limit=Math.round(x.value*.3);modal('🏦 ZAZO BANK','Şirket kredisi ve Holding mevduatı.',rows([['Şirket Kredi Limiti',money(limit)],['Banka Borcu',money(S.debt)],['Holding Mevduatı',money(S.deposit)]])+'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"><button class="action" id="loan">₺1.000.000 Kredi Çek</button><button class="action" id="pay">₺500.000 Borç Öde</button><button class="action" id="dep">Holding’den ₺1.000.000 Mevduat</button></div>');setTimeout(()=>{loan.onclick=()=>{if(S.debt+1e6>limit)return toast('Kredi limiti aşılıyor');S.debt+=1e6;x.cash+=1e6;save();render();bank()};pay.onclick=()=>{let q=Math.min(500000,S.debt);if(x.cash<q||!q)return toast('Ödeme yapılamıyor');x.cash-=q;S.debt-=q;save();render();bank()};dep.onclick=()=>{if(S.holding<1e6)return toast('Holding sermayesi yetersiz');S.holding-=1e6;S.deposit+=1e6;save();render();bank()}},0)}
function investment(){modal('📈 YATIRIM MERKEZİ','Holding sermayesiyle yatırım yap.',rows([['Altın',S.portfolio.gold+' birim'],['Hisse',S.portfolio.stock+' lot'],['Kripto',S.portfolio.crypto+' birim']])+'<button class="action" id="gold">10 Altın Al — '+money(25000)+'</button>');setTimeout(()=>{gold.onclick=()=>{if(S.holding<25000)return toast('Holding sermayesi yetersiz');S.holding-=25000;S.portfolio.gold+=10;save();render();investment()}},0)}
function holdingPanel(){modal('♛ ZAZO HOLDİNG','Tüm şirketlerin konsolide merkezi.','<div class="cols"><div class="panel"><h3>Holding</h3>'+rows([['Sermaye',money(S.holding)],['Grup Değeri',money(S.companies.reduce((a,b)=>a+b.value,0))],['Şirket Kasaları',money(S.companies.reduce((a,b)=>a+b.cash,0))],['Banka Borcu',money(S.debt)]])+'</div><div class="panel"><h3>Şirketler</h3>'+rows(S.companies.map(q=>[q.name,money(q.cash)]))+'</div></div>')}
function groupReport(){modal('📊 GRUP RAPORU','10 şirketin gerçek işlem performansı.','<div class="panel">'+rows(S.companies.map(q=>[q.name,money(q.totalSales-q.totalCosts)+' net']))+'</div>')}
function achievements(){let total=S.companies.reduce((a,b)=>a+b.totalSales,0),lvl=Math.max(...S.companies.map(x=>x.level));modal('🏆 BAŞARILAR','İmparatorluk kilometre taşları.',rows([['İlk Şirket','✓'],['₺1M Satış',total>=1e6?'✓':'—'],['LTD Şirket',lvl>=3?'✓':'—'],['AŞ Şirket',lvl>=5?'✓':'—'],['10 Şirket','✓']]))}
function settings(){modal('⚙️ AYARLAR','Oyun kaydı bu cihazda otomatik tutulur.',rows([['Otomatik Kayıt','Açık'],['Oyun Günü',S.day],['Sürüm','V6 Real Game']]))}
document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('open');document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};
document.querySelector('#reset').onclick=()=>{if(!confirm('TÜM ZAZO TYCOON V6 oyun verileri silinsin ve oyun baştan başlasın mı?'))return;localStorage.removeItem(KEY);S=fresh();save();render();document.querySelector('#modal').classList.remove('open');toast('Oyun baştan başladı')};
setInterval(()=>{S.day++;S.companies.forEach((x,i)=>{let d=SECTORS[i],salary=x.staff*850;if(x.cash>salary){x.cash-=salary;x.totalCosts+=salary}if(x.manager){if(x.raw<8&&x.cash>d.buy*20){x.cash-=d.buy*20;x.totalCosts+=d.buy*20;x.raw+=20}let q=Math.min(5,x.raw);if(q&&x.cash>d.make*q){x.raw-=q;x.cash-=d.make*q;x.totalCosts+=d.make*q;x.warehouse+=q}let sh=Math.min(5,x.warehouse);if(sh){let cost=Math.max(100,d.sell*.01)*sh;if(x.cash>cost){x.warehouse-=sh;x.shop+=sh;x.cash-=cost;x.totalCosts+=cost}}let sl=Math.min(3,x.shop);if(sl){let rev=d.sell*sl,profit=Math.max(0,(d.sell-d.buy-d.make-Math.max(100,d.sell*.01))*sl),h=Math.round(profit*.2);x.shop-=sl;x.cash+=rev-h;S.holding+=h;x.totalSales+=rev;x.holdingPaid+=h}}});save();render()},45000);
render();
</script></body></html>
