<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAZO TYCOON — World Edition V7</title>
<style>
*{box-sizing:border-box} :root{--gold:#e7bd59;--gold2:#ffe7a5;--ink:#02080d;--nav:#06131c;--panel:#081d29;--line:#80652f;--muted:#9cafb7;--white:#f4f7f8}
html,body{margin:0;background:#02070b;color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
#app{min-height:100vh;background:#041019}.top{height:58px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#041019ee;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.logo{font-size:19px;font-weight:950;color:var(--gold2)}.logo small{display:block;font-size:7px;letter-spacing:3px;color:#9cafb7}.hud{margin-left:auto;display:flex;gap:6px}.chip{border:1px solid #38505b;background:#0a202c;border-radius:9px;padding:7px 9px;font-size:11px}.chip b{color:var(--gold2)}
.layout{display:grid;grid-template-columns:66px 1fr}.rail{background:#061722;border-right:1px solid var(--line);padding:7px;display:flex;flex-direction:column;gap:7px}.rail button{height:50px;border:1px solid #5e4d2a;background:#0a202c;border-radius:10px;font-size:21px}.rail button.on,.rail button:hover{border-color:var(--gold2);background:#5d4318}
.screen{min-width:0}.screenHead{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px}.screenHead h1{font-size:22px;margin:0;color:var(--gold2)}.screenHead p{font-size:11px;color:var(--muted);margin:2px 0}.back{display:none;border:1px solid #705a2f;background:#0b2431;border-radius:9px;padding:8px 10px}.back.show{display:block}
.stage{height:calc(100vh - 174px);min-height:500px;margin:0 11px 8px;position:relative;overflow:hidden;border:1px solid #907136;border-radius:15px;background:#17384a}
.citySky{position:absolute;inset:0;background:linear-gradient(#527f9a 0,#a6b9bd 46%,#51675d 47%,#1a2927 100%)}.cityRoad{position:absolute;left:-5%;right:-5%;bottom:0;height:38%;background:linear-gradient(165deg,#334148 0 42%,#202b30 43% 63%,#39474b 64%);clip-path:polygon(0 18%,100% 0,100% 100%,0 100%)}.cityRoad:after{content:"";position:absolute;left:0;right:0;top:48%;border-top:3px dashed #d5c88d88}
.tower{position:absolute;bottom:25%;width:12%;border:2px solid #81959d;background:linear-gradient(90deg,#152d39,#526d78,#18333f);box-shadow:0 18px 35px #0007}.tower:before{content:"";position:absolute;inset:9px;background-image:linear-gradient(#f4c85b44 1px,transparent 1px),linear-gradient(90deg,#f4c85b44 1px,transparent 1px);background-size:18px 17px}.tower b{position:absolute;left:0;right:0;top:42%;text-align:center;color:var(--gold2);font-size:10px;z-index:2}.t1{left:7%;height:34%}.t2{left:22%;height:45%}.t3{left:38%;height:58%;width:18%}.t4{right:26%;height:39%}.t5{right:8%;height:48%}
.landmark{position:absolute;z-index:5;border:1px solid var(--gold);background:#06131dde;border-radius:10px;padding:8px 10px;font-weight:850;box-shadow:0 8px 22px #0007}.landmark small{display:block;color:#b9c5ca;font-size:8px;font-weight:400}.lm1{left:10%;top:49%}.lm2{left:27%;top:39%}.lm3{left:45%;top:25%}.lm4{right:25%;top:45%}.lm5{right:8%;top:35%}
.companyStage{position:absolute;inset:0;background:linear-gradient(#547b8e 0,#b1bec0 47%,#46564c 48%,#15211e 100%)}.companyStage.textile{background:url('textile-campus.png') center/cover no-repeat}.companyStage:after,.facilityStage:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#020b12d5,transparent 30%),linear-gradient(90deg,#020b1270,transparent 25%,transparent 75%,#020b1260);pointer-events:none}
.campusBuilding{position:absolute;left:23%;bottom:24%;width:54%;height:49%;border:2px solid #84979e;background:linear-gradient(90deg,#132c38,#58717b,#17323d);border-radius:9px 9px 0 0;box-shadow:0 25px 45px #0008}.textile .campusBuilding{display:none}.campusBuilding:before{content:"";position:absolute;inset:14px;background-image:linear-gradient(#ffd66a55 1px,transparent 1px),linear-gradient(90deg,#ffd66a44 1px,transparent 1px);background-size:31px 24px}.campusBuilding b{position:absolute;z-index:2;left:0;right:0;top:38%;text-align:center;font-size:27px;color:var(--gold2);text-shadow:0 3px 7px #000}
.deco{position:absolute;z-index:2;font-size:58px;filter:drop-shadow(0 8px 6px #0007)}.deco.a{left:10%;bottom:25%}.deco.b{right:10%;bottom:24%}.deco.c{right:29%;bottom:12%;font-size:42px}
.sceneTitle{position:absolute;z-index:8;left:14px;top:14px;border:1px solid #8b6e34;background:#05131ddd;border-radius:10px;padding:9px}.sceneTitle b{color:var(--gold2)}.sceneTitle small{display:block;color:#c1ccd0}
.hot{position:absolute;z-index:8;border:1px solid var(--gold);background:#06131ddd;border-radius:9px;padding:8px 10px;font-weight:850}.hot small{display:block;font-size:8px;color:#b8c5ca;font-weight:400}.ho{left:28%;top:48%}.hp{right:25%;top:45%}.hw{right:11%;top:65%}.hs{left:47%;top:70%}
.facilityStage{position:absolute;inset:0;background:linear-gradient(#253b46,#101c22)}.interiorWall{position:absolute;left:5%;right:5%;top:7%;bottom:27%;background:linear-gradient(90deg,#152934,#3c5058,#142833);border:2px solid #61727a;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#3e4646,#1a2325)}.machine{position:absolute;bottom:25%;width:17%;height:25%;border:2px solid #79898f;background:#213943;border-radius:6px}.machine:after{content:"";position:absolute;left:10%;right:10%;top:20%;height:30%;background:#d7aa3b55;border:1px solid #d7aa3b}.m1{left:12%}.m2{left:32%}.m3{left:52%}.m4{left:72%}.shelf{position:absolute;bottom:23%;width:17%;height:38%;border:3px solid #665c45;background:repeating-linear-gradient(#29383d 0 20%,#7a6845 21% 23%)}.counter{position:absolute;left:17%;right:17%;bottom:20%;height:20%;background:linear-gradient(#6b5430,#2b251c);border:2px solid #a28245}.officeDesk{position:absolute;left:30%;right:30%;bottom:20%;height:18%;background:#513f27;border:2px solid #a68246}.officeChair{position:absolute;left:45%;bottom:14%;font-size:60px}.facilityArt{position:absolute;z-index:3;left:8%;right:8%;top:13%;text-align:center;font-size:90px;opacity:.8}
.playPanel{position:absolute;z-index:12;right:13px;top:13px;width:min(340px,43%);background:#061722e8;border:1px solid #8c6f35;border-radius:12px;padding:11px;backdrop-filter:blur(9px)}.playPanel h3{margin:0 0 7px;color:var(--gold2)}.row{display:flex;justify-content:space-between;gap:8px;padding:6px;border-bottom:1px solid #1c3440;font-size:11px}.row:last-child{border:0}.actions{display:grid;grid-template-columns:1fr 82px;gap:6px;margin-top:8px}.actions input,.actions select{background:#04121a;border:1px solid #435a65;border-radius:8px;padding:8px;min-width:0}.action{grid-column:1/-1;border:1px solid #80652f;background:#5b4219;border-radius:8px;padding:9px;font-weight:850;color:#fff0b8}.action.secondary{background:#0c2633}
.bottom{height:50px;display:flex;gap:6px;overflow-x:auto;padding:4px 11px 6px}.companyBtn{min-width:135px;border:1px solid #5d4d2b;background:#0a202c;border-radius:9px;padding:5px 8px;text-align:left}.companyBtn.on{border-color:var(--gold2);background:#5a4118}.companyBtn b{display:block;font-size:10px}.companyBtn small{color:var(--muted);font-size:8px}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:90;align-items:center;justify-content:center;padding:14px}.overlay.open{display:flex}.card{width:min(850px,100%);max-height:88vh;overflow:auto;background:#081d29;border:1px solid #907137;border-radius:14px;padding:14px}.card h2{margin:0;color:var(--gold2)}.close{float:right;border:1px solid #536a74;background:#112b38;border-radius:8px;padding:7px 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{border:1px solid #294551;background:#061720;border-radius:10px;padding:10px}.box h3{margin:0 0 7px;color:var(--gold2)}.log{max-height:260px;overflow:auto}.log div{font-size:10px;padding:6px;border-bottom:1px solid #1a323d}.toast{display:none;position:fixed;right:12px;bottom:12px;z-index:120;border:1px solid #967737;background:#0c2836;border-radius:9px;padding:10px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.rail{display:grid;grid-template-columns:repeat(5,1fr);border-right:0;border-bottom:1px solid var(--line)}.rail button{height:38px;font-size:17px}.stage{height:calc(100vh - 225px);min-height:480px}.hud{gap:3px}.chip{padding:6px;font-size:9px}.screenHead h1{font-size:18px}.playPanel{left:9px;right:9px;top:auto;bottom:8px;width:auto;max-height:45%;overflow:auto}.hot{font-size:9px}.grid2{grid-template-columns:1fr}.facilityArt{font-size:65px}.bottom{height:56px}}
</style></head><body><div id="app">
<header class="top"><div class="logo">♛ ZAZO TYCOON<small>BUSINESS EMPIRE — WORLD EDITION</small></div><div class="hud"><div class="chip">Holding <b id="holding"></b></div><div class="chip">Grup <b id="group"></b></div><div class="chip">Gün <b id="day"></b></div></div></header>
<div class="layout"><aside class="rail" id="rail"></aside><section class="screen"><div class="screenHead"><button class="back" id="back">← Geri</button><div><h1 id="title"></h1><p id="subtitle"></p></div></div><div class="stage" id="stage"></div><div class="bottom" id="bottom"></div></section></div></div>
<div class="overlay" id="overlay"><div class="card"><button class="close" id="close">✕</button><h2 id="ot"></h2><p id="od" style="color:var(--muted);font-size:11px"></p><div id="ob"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='zazoWorldV7';
const D=[
['ZAZO TEKSTİL','Tekstil','🧵',['🧵','🚚','🏭'],'Pamuk & Kumaş','Tekstil Ürünü',350,190,950],
['ZAZO İNŞAAT','İnşaat','🏗️',['🏗️','🚜','🏢'],'İnşaat Malzemesi','Konut Projesi',2200000,1800000,6500000],
['ZAZO GIDA','Gıda','🥫',['🌾','🚚','🥫'],'Gıda Hammaddesi','Gıda Kolisi',80,45,260],
['ZAZO OTOMOTİV','Otomotiv','🚗',['🚗','🚛','🏭'],'Parça Seti','Otomobil',480000,220000,1150000],
['ZAZO TEKNOLOJİ','Teknoloji','💻',['💻','📱','🤖'],'Elektronik Parça','Akıllı Cihaz',4200,2600,12900],
['ZAZO LOJİSTİK','Lojistik','🚚',['🚚','🚛','📦'],'Yakıt & Operasyon','Taşıma Seferi',6200,2400,14500],
['ZAZO HAVACILIK','Havacılık','✈️',['✈️','🛫','🏢'],'Uçuş Operasyonu','Yolcu Uçuşu',185000,95000,520000],
['ZAZO UZAY','Uzay','🚀',['🚀','🛰️','🌌'],'Roket Bileşeni','Uydu Görevi',4800000,3200000,13500000],
['ZAZO ENERJİ','Enerji','⚡',['⚡','🔋','🏭'],'Enerji Kaynağı','Enerji Paketi',950,450,2600],
['ZAZO MADENCİLİK','Madencilik','⛏️',['⛏️','🚜','🪨'],'Saha Operasyonu','İşlenmiş Maden',1450,900,4200]
];
function fresh(){return{view:'city',current:0,facility:null,day:1,holding:25000000,debt:0,deposit:0,portfolio:{gold:0,stock:0,crypto:0},companies:D.map((d,i)=>({cash:i?1500000:3000000,value:5000000+i*500000,level:1,staff:8,manager:false,vehicles:1,raw:0,warehouse:0,store:0,sales:0,costs:0,holdingPaid:0,logs:[]}))}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const c=()=>S.companies[S.current],d=()=>D[S.current],money=n=>'₺'+Math.round(+n||0).toLocaleString('tr-TR'),save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.to);window.to=setTimeout(()=>e.style.display='none',1700)}
function rows(a){return a.map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function openOverlay(t,desc,body){ot.textContent=t;od.textContent=desc||'';ob.innerHTML=body;overlay.classList.add('open')}
const nav=[['🏙️','Şehir'],['🏢','Şirket'],['🏦','Banka'],['📈','Yatırım'],['♛','Holding'],['📊','Rapor'],['🏆','Başarı'],['🚚','Filo'],['⚙️','Ayar'],['↻','Sıfırla']];
rail.innerHTML=nav.map((n,i)=>'<button data-nav="'+i+'">'+n[0]+'</button>').join('');
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navClick(+b.dataset.nav));
function navClick(i){if(i===0){S.view='city';S.facility=null;save();render();return}if(i===1){S.view='company';S.facility=null;save();render();return}if(i===2)return bank();if(i===3)return invest();if(i===4)return holdingPanel();if(i===5)return report();if(i===6)return achievements();if(i===7){S.view='facility';S.facility='fleet';render();return}if(i===8)return settings();if(confirm('Tüm oyun verileri silinsin mi?')){localStorage.removeItem(KEY);S=fresh();save();render();toast('Yeni oyun başladı')}}
function render(){holding.textContent=money(S.holding);group.textContent=money(S.companies.reduce((a,b)=>a+b.value,0));day.textContent=S.day;back.classList.toggle('show',S.view!=='city');bottom.innerHTML=S.companies.map((x,i)=>'<button class="companyBtn '+(i===S.current?'on':'')+'" data-c="'+i+'"><b>'+D[i][2]+' '+D[i][0]+'</b><small>Sv.'+x.level+' • '+money(x.cash)+'</small></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.current=+b.dataset.c;S.view='company';S.facility=null;save();render()});if(S.view==='city')city();else if(S.view==='company')company();else facility()}
back.onclick=()=>{if(S.view==='facility'){S.view='company';S.facility=null}else{S.view='city'}save();render()}
function city(){title.textContent='ZAZO ŞEHRİ';subtitle.textContent='İş imparatorluğunun ana dünyası — şirketine veya merkeze dokun.';stage.innerHTML='<div class="citySky"></div><div class="cityRoad"></div><div class="tower t1"><b>BANKA</b></div><div class="tower t2"><b>YATIRIM</b></div><div class="tower t3"><b>ZAZO HOLDİNG</b></div><div class="tower t4"><b>PAZAR</b></div><div class="tower t5"><b>ŞİRKETLER</b></div><button class="landmark lm1" data-city="bank">🏦 BANKA<small>Kredi & mevduat</small></button><button class="landmark lm2" data-city="invest">📈 YATIRIM<small>Portföy merkezi</small></button><button class="landmark lm3" data-city="holding">♛ HOLDİNG<small>Grup merkezi</small></button><button class="landmark lm4" data-city="market">🛒 PAZAR<small>Hammadde</small></button><button class="landmark lm5" data-city="company">🏢 ŞİRKETLER<small>Kampüslere git</small></button>';document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{let a=b.dataset.city;if(a==='bank')bank();else if(a==='invest')invest();else if(a==='holding')holdingPanel();else if(a==='market'){S.view='facility';S.facility='production';render()}else{S.view='company';render()}})}
function company(){let x=c(),q=d();title.textContent=q[0];subtitle.textContent=q[1]+' kampüsü • Seviye '+x.level+' • '+(x.level>=5?'AŞ':x.level>=3?'LTD':'Başlangıç Şirketi');stage.innerHTML='<div class="companyStage '+(S.current===0?'textile':'')+'"><div class="campusBuilding"><b>'+q[0]+'</b></div><div class="deco a">'+q[3][0]+'</div><div class="deco b">'+q[3][1]+'</div><div class="deco c">'+q[3][2]+'</div><div class="sceneTitle"><b>'+q[0]+'</b><small>Kasa '+money(x.cash)+' • Değer '+money(x.value)+'</small></div><button class="hot ho" data-f="office">🏢 OFİS<small>Yönetim & çalışan</small></button><button class="hot hp" data-f="production">🏭 '+(q[1]==='İnşaat'?'ŞANTİYE':'ÜRETİM')+'<small>'+q[5]+'</small></button><button class="hot hw" data-f="warehouse">📦 DEPO<small>Stok & sevkiyat</small></button><button class="hot hs" data-f="sales">🏪 SATIŞ<small>Pazar & mağaza</small></button></div>';document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.view='facility';S.facility=b.dataset.f;save();render()})}
function facility(){let x=c(),q=d(),f=S.facility;title.textContent=q[0]+' — '+({office:'Merkez Ofis',production:q[1]==='İnşaat'?'Şantiye':'Fabrika / Operasyon',warehouse:'Depo & Sevkiyat',sales:'Satış Merkezi',fleet:'Araç & Filo'}[f]||'Tesis');subtitle.textContent='Kampüsün içindesin — işlemleri bu sahnede yap.';let art='',panel='';
if(f==='office'){art='<div class="interiorWall"></div><div class="floor"></div><div class="officeDesk"></div><div class="officeChair">🪑</div><div class="facilityArt">🏢 '+q[2]+'</div>';panel='<h3>CEO OFİSİ</h3>'+rows([['Şirket Seviyesi',x.level],['Şirket Tipi',x.level>=5?'AŞ':x.level>=3?'LTD':'Başlangıç'],['Çalışan',x.staff],['Müdür',x.manager?'Aktif':'Yok'],['Kasa',money(x.cash)]])+'<button class="action" id="hire">+5 Çalışan • '+money(75000)+'</button><button class="action secondary" id="mgr">'+(x.manager?'Müdürü Kapat':'Müdür Al • '+money(150000))+'</button><button class="action secondary" id="upgrade">Şirketi Yükselt • '+money(x.level*1200000)+'</button>'}
else if(f==='production'){art='<div class="interiorWall"></div><div class="floor"></div><div class="machine m1"></div><div class="machine m2"></div><div class="machine m3"></div><div class="machine m4"></div><div class="facilityArt">'+q[3][2]+' '+q[2]+'</div>';panel='<h3>ÜRETİM HATTI</h3>'+rows([[q[4],x.raw+' birim'],[q[5]+' depoda',x.warehouse+' birim'],['Alış',money(q[6])],['Üretim',money(q[7])]])+'<div class="actions"><input id="qty" type="number" min="1" value="10"><span></span><button class="action" id="buy">Hammadde / Operasyon Satın Al</button><button class="action secondary" id="make">Üret / Operasyonu Tamamla</button></div>'}
else if(f==='warehouse'){art='<div class="interiorWall"></div><div class="floor"></div><div class="shelf" style="left:12%"></div><div class="shelf" style="left:33%"></div><div class="shelf" style="left:54%"></div><div class="shelf" style="left:75%"></div><div class="facilityArt">📦 '+q[2]+'</div>';panel='<h3>DEPO & LOJİSTİK</h3>'+rows([['Depo Stoku',x.warehouse+' birim'],['Satış Stoku',x.store+' birim'],['Araç',x.vehicles],['Sevk Maliyeti',money(Math.max(100,q[8]*.01))+'/birim']])+'<div class="actions"><input id="qty" type="number" min="1" value="5"><span></span><button class="action" id="ship">Mağazaya / Pazara Sevk Et</button></div>'}
else if(f==='sales'){art='<div class="interiorWall"></div><div class="floor"></div><div class="counter"></div><div class="facilityArt">🏪 '+q[5]+'</div>';panel='<h3>SATIŞ MERKEZİ</h3>'+rows([[q[5],x.store+' birim'],['Birim Fiyat',money(q[8])],['Toplam Satış',money(x.sales)],['Holding Payı',money(x.holdingPaid)]])+'<div class="actions"><input id="qty" type="number" min="1" value="3"><span></span><button class="action" id="sell">Müşteriye Sat</button></div>'}
else{art='<div class="interiorWall"></div><div class="floor"></div><div class="facilityArt">🚚 🚛 '+q[2]+'</div>';panel='<h3>FİLO MERKEZİ</h3>'+rows([['Araç Sayısı',x.vehicles],['Filo Değeri',money(x.vehicles*650000)],['Sektör',q[1]]])+'<button class="action" id="vehicle">Yeni Araç Al • '+money(650000)+'</button>'}
stage.innerHTML='<div class="facilityStage">'+art+'<div class="sceneTitle"><b>'+q[0]+'</b><small>'+title.textContent+'</small></div><div class="playPanel">'+panel+'</div></div>';bindFacility()}
function bindFacility(){let x=c(),q=d(),f=S.facility,el=id=>document.getElementById(id);if(f==='office'){el('hire').onclick=()=>{if(x.cash<75000)return toast('Kasa yetersiz');x.cash-=75000;x.costs+=75000;x.staff+=5;x.value+=100000;x.logs.push('Gün '+S.day+' • 5 çalışan alındı');save();render()};el('mgr').onclick=()=>{if(!x.manager&&x.cash<150000)return toast('Kasa yetersiz');if(!x.manager){x.cash-=150000;x.costs+=150000}x.manager=!x.manager;x.logs.push('Gün '+S.day+' • Müdür '+(x.manager?'aktif':'kapalı'));save();render()};el('upgrade').onclick=()=>{let cost=x.level*1200000;if(x.cash<cost)return toast('Kasa yetersiz');x.cash-=cost;x.costs+=cost;x.level++;x.value+=Math.round(cost*1.45);x.staff+=3;x.logs.push('Gün '+S.day+' • Seviye '+x.level);save();render();toast('Şirket büyüdü')}}else if(f==='production'){el('buy').onclick=()=>{let n=Math.max(1,Math.floor(+el('qty').value||0)),cost=n*q[6];if(x.cash<cost)return toast('Kasa yetersiz');x.cash-=cost;x.costs+=cost;x.raw+=n;x.logs.push('Gün '+S.day+' • '+n+' '+q[4]+' alındı');save();render()};el('make').onclick=()=>{let n=Math.max(1,Math.floor(+el('qty').value||0));if(x.raw<n)return toast(q[4]+' yetersiz');let cost=n*q[7];if(x.cash<cost)return toast('Üretim parası yetersiz');x.raw-=n;x.cash-=cost;x.costs+=cost;x.warehouse+=n;x.logs.push('Gün '+S.day+' • '+n+' '+q[5]+' üretildi');save();render()}}else if(f==='warehouse'){el('ship').onclick=()=>{let n=Math.max(1,Math.floor(+el('qty').value||0));if(x.warehouse<n)return toast('Depoda yeterli stok yok');let cost=n*Math.max(100,q[8]*.01);if(x.cash<cost)return toast('Sevk parası yetersiz');x.warehouse-=n;x.store+=n;x.cash-=cost;x.costs+=cost;x.logs.push('Gün '+S.day+' • '+n+' birim sevk edildi');save();render()}}else if(f==='sales'){el('sell').onclick=()=>{let n=Math.min(Math.max(1,Math.floor(+el('qty').value||0)),x.store);if(!n)return toast('Satış stoğu yok');let rev=n*q[8],profit=Math.max(0,(q[8]-q[6]-q[7]-Math.max(100,q[8]*.01))*n),h=Math.round(profit*.2);x.store-=n;x.cash+=rev-h;x.sales+=rev;x.holdingPaid+=h;x.value+=Math.round(profit*.03);S.holding+=h;x.logs.push('Gün '+S.day+' • '+n+' '+q[5]+' satıldı • '+money(rev));save();render();toast('Satış tamamlandı')}}else{el('vehicle').onclick=()=>{if(x.cash<650000)return toast('Kasa yetersiz');x.cash-=650000;x.costs+=650000;x.vehicles++;x.value+=700000;x.logs.push('Gün '+S.day+' • Araç alındı');save();render()}}}
function bank(){let x=c(),limit=Math.round(x.value*.3);openOverlay('🏦 ZAZO BANK','Şirket kredisi, borç ve Holding mevduatı.',rows([['Kredi Limiti',money(limit)],['Borç',money(S.debt)],['Mevduat',money(S.deposit)]])+'<button class="action" id="loan">₺1.000.000 Kredi Çek</button><button class="action secondary" id="pay">₺500.000 Borç Öde</button>');setTimeout(()=>{loan.onclick=()=>{if(S.debt+1e6>limit)return toast('Limit yetersiz');S.debt+=1e6;x.cash+=1e6;save();render();bank()};pay.onclick=()=>{let n=Math.min(500000,S.debt);if(!n||x.cash<n)return toast('Ödeme yapılamıyor');x.cash-=n;S.debt-=n;save();render();bank()}},0)}
function invest(){openOverlay('📈 YATIRIM MERKEZİ','Holding sermayesi ile yatırım.',rows([['Altın',S.portfolio.gold+' birim'],['Hisse',S.portfolio.stock+' lot'],['Kripto',S.portfolio.crypto+' birim']])+'<button class="action" id="gold">10 Altın Al • '+money(25000)+'</button>');setTimeout(()=>gold.onclick=()=>{if(S.holding<25000)return toast('Holding sermayesi yetersiz');S.holding-=25000;S.portfolio.gold+=10;save();render();invest()},0)}
function holdingPanel(){openOverlay('♛ ZAZO HOLDİNG','Tüm imparatorluğun konsolide merkezi.','<div class="grid2"><div class="box"><h3>Grup</h3>'+rows([['Holding Sermayesi',money(S.holding)],['Grup Değeri',money(S.companies.reduce((a,b)=>a+b.value,0))],['Şirket Kasaları',money(S.companies.reduce((a,b)=>a+b.cash,0))],['Banka Borcu',money(S.debt)]])+'</div><div class="box"><h3>Şirketler</h3>'+rows(S.companies.map((x,i)=>[D[i][0],money(x.cash)]))+'</div></div>')}
function report(){openOverlay('📊 GRUP RAPORU','Rakamlar gerçek oyun işlemlerinden gelir.','<div class="grid2"><div class="box"><h3>Net Sonuç</h3>'+rows(S.companies.map((x,i)=>[D[i][0],money(x.sales-x.costs)]))+'</div><div class="box"><h3>Son Hareketler</h3><div class="log">'+S.companies.flatMap((x,i)=>x.logs.slice(-3).map(l=>D[i][2]+' '+l)).slice(-25).reverse().map(l=>'<div>'+l+'</div>').join('')+'</div></div></div>')}
function achievements(){let sales=S.companies.reduce((a,b)=>a+b.sales,0),lv=Math.max(...S.companies.map(x=>x.level));openOverlay('🏆 BAŞARILAR','Şirketlerin büyüdükçe açılır.',rows([['İlk şirket','✓'],['₺1M gerçek satış',sales>=1e6?'✓':'—'],['LTD şirket',lv>=3?'✓':'—'],['AŞ şirket',lv>=5?'✓':'—'],['10 sektör','✓']]))}
function settings(){openOverlay('⚙️ AYARLAR','Oyun bu cihazda otomatik kaydedilir.',rows([['Otomatik kayıt','Açık'],['Oyun günü',S.day],['Sürüm','V7 World Edition']]))}
close.onclick=()=>overlay.classList.remove('open');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('open')};
setInterval(()=>{S.day++;S.companies.forEach((x,i)=>{let q=D[i],salary=x.staff*850;if(x.cash>salary){x.cash-=salary;x.costs+=salary}if(x.manager){if(x.raw<8&&x.cash>q[6]*12){x.cash-=q[6]*12;x.costs+=q[6]*12;x.raw+=12}let n=Math.min(3,x.raw);if(n&&x.cash>q[7]*n){x.raw-=n;x.cash-=q[7]*n;x.costs+=q[7]*n;x.warehouse+=n}let sh=Math.min(3,x.warehouse);if(sh){let cost=sh*Math.max(100,q[8]*.01);if(x.cash>cost){x.warehouse-=sh;x.store+=sh;x.cash-=cost;x.costs+=cost}}let sl=Math.min(2,x.store);if(sl){let rev=sl*q[8],profit=Math.max(0,(q[8]-q[6]-q[7]-Math.max(100,q[8]*.01))*sl),h=Math.round(profit*.2);x.store-=sl;x.cash+=rev-h;x.sales+=rev;x.holdingPaid+=h;S.holding+=h}}});save();render()},45000);
render();
</script></body></html>
