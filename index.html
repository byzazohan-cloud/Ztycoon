// ZAZOHAN YH-10 GLB: isolated integration. Legacy truck stays visible until GLB is fully ready.
const legacyTruckChildren=[...truck.children];
const yh10Loader=new GLTFLoader();
yh10Loader.load('./ZAZOHAN_YH10_10K.glb',(gltf)=>{
  try{
    const yh10=gltf.scene;
    yh10.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    let box=new THREE.Box3().setFromObject(yh10), size=new THREE.Vector3(), center=new THREE.Vector3();
    box.getSize(size); box.getCenter(center);
    yh10.position.sub(center);
    const scale=10.8/Math.max(size.x,0.001);
    yh10.scale.setScalar(scale);
    yh10.rotation.y=Math.PI/2;
    box=new THREE.Box3().setFromObject(yh10); box.getSize(size); box.getCenter(center);
    yh10.position.x-=center.x; yh10.position.z-=center.z; yh10.position.y-=box.min.y;
    truck.add(yh10);
    legacyTruckChildren.forEach(o=>o.visible=false);
    say('ZAZOHAN YH-10 hazır');
  }catch(err){console.error('YH-10 hazırlama hatası',err);say('YH-10 yüklenemedi; yedek araç aktif');}
},undefined,(err)=>{console.error('YH-10 GLB yükleme hatası',err);say('YH-10 yüklenemedi; yedek araç aktif');});


// ZAZOHAN forklift GLB: legacy forklift remains as fallback until asset is ready.
const legacyForkChildren=[...fork.children];
const forkliftLoader=new GLTFLoader();
let gameForklift=null;
forkliftLoader.load('./ZAZOHAN_FORKLIFT_10K.glb',(gltf)=>{
  try{
    const f=gltf.scene;
    f.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    let bb=new THREE.Box3().setFromObject(f), sz=new THREE.Vector3(), ct=new THREE.Vector3();
    bb.getSize(sz); bb.getCenter(ct); f.position.sub(ct);
    const sc=4.2/Math.max(sz.x,sz.z,0.001); f.scale.setScalar(sc);
    bb=new THREE.Box3().setFromObject(f); bb.getCenter(ct); f.position.x-=ct.x;f.position.z-=ct.z;f.position.y-=bb.min.y;
    fork.add(f); gameForklift=f; legacyForkChildren.forEach(o=>o.visible=false);
    say('ZAZOHAN forklift hazır');
  }catch(e){console.error(e);say('Forklift asseti yüklenemedi; yedek aktif');}
},undefined,e=>{console.error(e);say('Forklift asseti yüklenemedi; yedek aktif');});

// Physical loading props: visible pallet follows forklift and is deposited at the truck.
const carriedPallet=new THREE.Group();
const palletBase=mesh(new THREE.BoxGeometry(1.45,.16,1.05),0x8a5a2b);palletBase.position.y=.08;carriedPallet.add(palletBase);
for(const x of [-.36,.36])for(const z of [-.25,.25]){const b=mesh(new THREE.BoxGeometry(.62,.58,.42),0xc88a45);b.position.set(x,.46,z);carriedPallet.add(b)}
carriedPallet.visible=false;scene.add(carriedPallet);
const deposited=[];
const forkHome=new THREE.Vector3(7,0,5), pickupPoint=new THREE.Vector3(4.8,0,-10.5), truckLoadPoint=new THREE.Vector3(-5.2,0,3.0);
function faceMove(obj,from,to){const dx=to.x-from.x,dz=to.z-from.z;if(Math.hypot(dx,dz)>.001)obj.rotation.y=Math.atan2(dx,dz);}
function tweenPos(obj,to,dur=650){return new Promise(resolve=>{const from=obj.position.clone(),start=performance.now();faceMove(obj,from,to);function tick(now){const t=Math.min(1,(now-start)/dur),q=t*t*(3-2*t);obj.position.lerpVectors(from,to,q);if(t<1)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)})}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function loadOnePallet(n){
  await tweenPos(fork,pickupPoint,700); carriedPallet.visible=true; carriedPallet.position.copy(fork.position).add(new THREE.Vector3(0,.45,-1.8));
  await wait(180); await tweenForkWithPallet(truckLoadPoint,850); carriedPallet.visible=false;
  const d=carriedPallet.clone(true);d.visible=true;d.position.set(-6.0+(n%2)*1.25,1.05,1.2-Math.floor(n/2)*.75);scene.add(d);deposited.push(d);
  await tweenPos(fork,forkHome,750);
}
function tweenForkWithPallet(to,dur){return new Promise(resolve=>{const from=fork.position.clone(),start=performance.now();faceMove(fork,from,to);function tick(now){const t=Math.min(1,(now-start)/dur),q=t*t*(3-2*t);fork.position.lerpVectors(from,to,q);carriedPallet.position.copy(fork.position).add(new THREE.Vector3(0,.45,-1.8).applyAxisAngle(new THREE.Vector3(0,1,0),fork.rotation.y));if(t<1)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)})}
async function runLoading(){main.disabled=true;for(let n=1;n<=8;n++){await loadOnePallet(n);state.loaded=n;bar.style.width=(n/8*100)+'%';desc.textContent=`Yükleniyor: ${n}/8 palet`;}state.step=2;main.disabled=false;say('8 palet fiziksel olarak yüklendi');ui()}
const truckStart=new THREE.Vector3(-7,0,6);
async function runTruckDeparture(){state.step=3;ui();const path=[new THREE.Vector3(-2,0,9),new THREE.Vector3(6,0,13),new THREE.Vector3(13,0,18),new THREE.Vector3(24,0,20)];for(const pt of path)await tweenPos(truck,pt,850);truck.visible=false;setTimeout(()=>{state.step=4;ui();say('Teslimat başarıyla tamamlandı')},700)}
function resetVehicles(){fork.position.copy(forkHome);fork.rotation.y=0;truck.visible=true;truck.position.copy(truckStart);truck.rotation.y=0;carriedPallet.visible=false;deposited.splice(0).forEach(o=>scene.remove(o));}

const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(-5,2,-3);controls.minDistance=18;controls.maxDistance=52;controls.maxPolarAngle=1.35;controls.enablePan=true;
let state={step:0,money:50000,loaded:0}; const main=document.querySelector('#main'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),bar=document.querySelector('#bar'),money=document.querySelector('#money'),toast=document.querySelector('#toast');
function say(s){toast.textContent=s;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1700)} function ui(){money.textContent='₺'+state.money.toLocaleString('tr-TR'); const d=[['İlk Sevkiyat',"Mobilya paletlerini Bursa'ya göndermek için işi kabul et.",'İşi Kabul Et'],['Yükleme','Forklift 8 paleti ZAZOHAN YH-10 aracına yükleyecek.','Yüklemeyi Başlat'],['Yük Hazır','Araç yüklendi. Bursa seferini başlat.','Sefere Çık'],['Seferde','ZAZOHAN YH-10 teslimata gidiyor…','Sefer Sürüyor'],['Teslimat Tamamlandı','₺8.500 gelir, ₺2.000 gider. Net kazanç ₺6.500.','Ödemeyi Al'],['V0.1 Hedefi','İlk teslimat tamamlandı. Yeni iş alarak şirketini büyütebilirsin.','Yeni İş']][state.step];title.textContent=d[0];desc.textContent=d[1];main.textContent=d[2];main.disabled=state.step===3;bar.style.width=state.step===0?'0%':state.step===1?(state.loaded/8*100)+'%':state.step<4?'100%':'100%'}
main.onclick=()=>{if(state.step===0){state.step=1;say('İş kabul edildi: İstanbul → Bursa');ui()}else if(state.step===1){runLoading()}else if(state.step===2){runTruckDeparture()}else if(state.step===4){state.money+=6500;state.step=5;ui();say('Net ₺6.500 hesabına eklendi')}else{state.step=0;state.loaded=0;resetVehicles();ui()}};
document.querySelector('#reset').onclick=()=>{state={step:0,money:50000,loaded:0};resetVehicles();ui();say('Yeni oyun başlatıldı')};ui();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
