<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ZAZOHAN YH-10 Yakın İnceleme</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#20242a;font-family:Arial}#info{position:fixed;left:12px;top:12px;z-index:2;background:#000b;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.35}#toggle{margin-top:7px;border:0;border-radius:7px;padding:6px 9px;background:#f4b400;color:#111;font-weight:700}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="info"><b>ZAZOHAN YH-10</b><br>Meshy 6 Lite • Yakın geometri inceleme<br>Sürükle: döndür • Teker/pinch: yakınlaştır<br><button id="toggle">Tel görünümünü aç/kapat</button></div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x20242a);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x30343b,2.0));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0xbfd6ff,1.3);fill.position.set(-5,3,-4);scene.add(fill);const rim=new THREE.DirectionalLight(0xffe3b0,1.0);rim.position.set(2,4,-6);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x6e747b,roughness:.88}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=1.6;controls.maxDistance=8;let wire=false, mats=[];
new GLTFLoader().load('./ZAZOHAN_YH10_MESHY_LITE.glb',g=>{const m=g.scene;m.traverse(o=>{if(o.isMesh){if(o.geometry){o.geometry.deleteAttribute('color');if(!o.geometry.getAttribute('normal'))o.geometry.computeVertexNormals();}o.material=new THREE.MeshStandardMaterial({color:0xc9cdd2,roughness:.5,metalness:.08,vertexColors:false,side:THREE.DoubleSide});mats.push(o.material);o.castShadow=true;o.receiveShadow=true;}});const box=new THREE.Box3().setFromObject(m),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);m.position.sub(center);m.position.y+=size.y/2;const s=3.8/Math.max(size.x,size.z);m.scale.setScalar(s);scene.add(m);const b=new THREE.Box3().setFromObject(m),c=new THREE.Vector3(),sz=new THREE.Vector3();b.getCenter(c);b.getSize(sz);controls.target.copy(c);camera.position.set(c.x+sz.x*.72,c.y+sz.y*.52,c.z+sz.z*1.18);controls.update();},undefined,e=>{document.getElementById('info').insertAdjacentHTML('beforeend','<br><span style="color:#ff8b8b">GLB yüklenemedi</span>');console.error(e)});
document.getElementById('toggle').onclick=()=>{wire=!wire;mats.forEach(x=>x.wireframe=wire)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});</script></body></html>
