<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ZAZOHAN YH-10 Meshy Test</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial}#info{position:fixed;left:12px;top:12px;z-index:2;background:#000b;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="info"><b>ZAZOHAN YH-10</b><br>Meshy 6 Lite • GLB test sahnesi<br>Sürükle: döndür • Teker/pinch: yakınlaştır</div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9c0c7);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera.position.set(3,2,4);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x8a9098,3.2));const sun=new THREE.DirectionalLight(0xffffff,4.5);sun.position.set(4,7,5);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x8c949c,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(20,20,0x777777,0x444444);grid.position.y=.002;scene.add(grid);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.55,0);const loader=new GLTFLoader();loader.load('./ZAZOHAN_YH10_MESHY_LITE.glb',g=>{const m=g.scene;m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material=new THREE.MeshStandardMaterial({color:0xe8e8e5,roughness:.58,metalness:.02,side:THREE.DoubleSide})}});const box=new THREE.Box3().setFromObject(m),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);m.position.sub(center);m.position.y+=size.y/2;const s=2.7/Math.max(size.x,size.z);m.scale.setScalar(s);scene.add(m);const b2=new THREE.Box3().setFromObject(m),c2=new THREE.Vector3();b2.getCenter(c2);controls.target.copy(c2);camera.position.set(c2.x+3.0,c2.y+1.55,c2.z+3.8);controls.update();},undefined,e=>{document.getElementById('info').innerHTML+='<br><span style="color:#ff8b8b">GLB yüklenemedi</span>';console.error(e)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});</script></body></html>
