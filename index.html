<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>YÜK HATTI V0.1.1</title><style>

</style></head><body><div id='game'></div><div id='hud'><div class='top'><div class='brand'>YÜK <b>HATTI</b> <small>V0.1.1</small></div><div class='pill'>ZAZOHAN YH-10</div><div class='pill'>MOBIL KAMERA</div><div class='pill money' id='money'>₺50.000</div></div><div class='toast' id='toast'></div><div id='advisor'><b>Danışman: Efe</b><p id='advisorText'>İlk sevkiyatın hazır. İşi kabul ederek başlayalım.</p></div><div class='panel'><h3 id='title'>İlk Sevkiyat</h3><p id='desc'>Mobilya paletlerini Bursa'ya göndermek için işi kabul et.</p><div class='progress'><div class='bar' id='bar'></div></div><div class='actions'><button class='primary' id='main'>İşi Kabul Et</button><button id='reset'>Yeni Oyun</button></div></div><div class='hint'>Sürükle: kamera • Sıkıştır: yakınlaştır • Tesis nesnelerine dokunabilirsin</div></div>
<script type='importmap'>{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type='module'>
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const root=document.querySelector('#game'), scene=new THREE.Scene(); scene.background=new THREE.Color(0x91c9ee); scene.fog=new THREE.Fog(0x91c9ee,55,110);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180); camera.position.set(30,28,34);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff2ff,0x586b42,2.2)); const sun=new THREE.DirectionalLight(0xffffff,2.5); sun.position.set(20,35,15); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8}); const box=(x,y,z,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));m.position.set(px,py,pz);m.castShadow=m.receiveShadow=true;scene.add(m);return m};
box(62,.5,48,0x707b78,0,-.25,0); box(64,.25,5,0x39464c,0,-.1,25); for(let i=-28;i<30;i+=8) box(4,.03,.18,0xf2d14a,i,.04,24.8);
// depot
box(24,8,12,0x697983,-7,4,-9); box(24,.7,13,0x344a59,-7,8.3,-9); box(6,5,.35,0x263844,-13,2.5,-2.85); box(6,5,.35,0x263844,-4,2.5,-2.85);
box(10,5,8,0x87918d,13,2.5,-9); box(10,.5,8.5,0x485b61,13,5.2,-9);
// fence posts
for(let x=-30;x<=30;x+=3){box(.12,2,.12,0x263238,x,1,-23);box(.12,2,.12,0x263238,x,1,22)} for(let z=-20;z<=20;z+=3){box(.12,2,.12,0x263238,-30,1,z);box(.12,2,.12,0x263238,30,1,z)}
// pallets
const pallets=[]; function pallet(x,z){const g=new THREE.Group(); const base=box(2,.25,1.5,0x8a5a2b,x,.3,z); for(let a=0;a<2;a++)for(let b=0;b<2;b++){const p=box(.85,.85,.6,0xc88a45,x-.45+a*.9,.85,z-.32+b*.65);pallets.push(p)} return base} pallet(-16,-1);pallet(-11,-1);pallet(-6,-1);pallet(5,-13);
// truck group
const truck=new THREE.Group(); const cab=new THREE.Mesh(new THREE.BoxGeometry(3.5,3.3,3.6),mat(0xf2f2ed));cab.position.set(0,2,2.7);cab.castShadow=true;truck.add(cab); const cargo=new THREE.Mesh(new THREE.BoxGeometry(4,4.2,8),mat(0xe9e8df));cargo.position.set(0,2.6,-3);cargo.castShadow=true;truck.add(cargo); const grill=new THREE.Mesh(new THREE.BoxGeometry(2.5,.65,.15),mat(0x17222a));grill.position.set(0,1.8,4.55);truck.add(grill); for(const x of [-1.45,1.45])for(const z of [-4.5,2.8]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.65,.65,.45,16),mat(0x151515));w.rotation.z=Math.PI/2;w.position.set(x,.7,z);truck.add(w)} truck.position.set(-5,0,7);truck.rotation.y=Math.PI;scene.add(truck);
// forklift
const fork=new THREE.Group(); const fb=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.5,2.8),mat(0xe9a51d));fb.position.y=1;fb.castShadow=true;fork.add(fb); const mast=new THREE.Mesh(new THREE.BoxGeometry(.2,3.2,.2),mat(0x222a2e));mast.position.set(0,2,-1.55);fork.add(mast); fork.position.set(7,0,5);scene.add(fork);
// workers
for(const [x,z] of [[2,1],[12,0]]){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,1.7,8),mat(0xe3a62e));b.position.y=1.2;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),mat(0xd8a071));h.position.y=2.3;g.add(h);g.position.set(x,0,z);scene.add(g)}
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,2,-2);controls.minDistance=24;controls.maxDistance=58;controls.maxPolarAngle=1.35;controls.enablePan=true;
let state={step:0,money:50000,loaded:0}; const main=document.querySelector('#main'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),bar=document.querySelector('#bar'),money=document.querySelector('#money'),toast=document.querySelector('#toast');
const advisorText=document.querySelector('#advisorText'); function advise(s){if(advisorText)advisorText.textContent=s} function say(s){toast.textContent=s;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1700)} function ui(){money.textContent='₺'+state.money.toLocaleString('tr-TR'); const d=[['İlk Sevkiyat',"Mobilya paletlerini Bursa'ya göndermek için işi kabul et.",'İşi Kabul Et'],['Yükleme','Forklift 8 paleti ZAZOHAN YH-10 aracına yükleyecek.','Yüklemeyi Başlat'],['Yük Hazır','Araç yüklendi. Bursa seferini başlat.','Sefere Çık'],['Seferde','ZAZOHAN YH-10 teslimata gidiyor…','Sefer Sürüyor'],['Teslimat Tamamlandı','₺8.500 gelir, ₺2.000 gider. Net kazanç ₺6.500.','Ödemeyi Al'],['V0.1 Hedefi','İlk teslimat tamamlandı. Yeni iş alarak şirketini büyütebilirsin.','Yeni İş']][state.step];title.textContent=d[0];desc.textContent=d[1];main.textContent=d[2];main.disabled=state.step===3;bar.style.width=state.step===0?'0%':state.step===1?(state.loaded/8*100)+'%':state.step<4?'100%':'100%'}
main.onclick=()=>{if(state.step===0){state.step=1;advise('Güzel. Şimdi yüklemeyi başlat. Forklift paletleri ZAZOHAN YH-10’a taşıyacak.');say('İş kabul edildi: İstanbul → Bursa');ui()}else if(state.step===1){main.disabled=true;let n=0;const iv=setInterval(()=>{n++;state.loaded=n;fork.position.x-=.25;bar.style.width=(n/8*100)+'%';desc.textContent=`Yükleniyor: ${n}/8 palet`;if(n===8){clearInterval(iv);state.step=2;main.disabled=false;advise('Araç hazır. Sefere Çık düğmesiyle Bursa teslimatını başlat.');say('Yükleme tamamlandı');ui()}},350)}else if(state.step===2){state.step=3;ui();let t=0;const iv=setInterval(()=>{t++;truck.position.z+=1.1;if(t>18){clearInterval(iv);truck.visible=false;setTimeout(()=>{state.step=4;ui();advise('Teslimat tamamlandı. Ödemeyi al ve şirket kasanı büyüt.');say('Teslimat başarıyla tamamlandı')},1200)}},80)}else if(state.step===4){state.money+=6500;state.step=5;ui();say('Net ₺6.500 hesabına eklendi')}else{state.step=0;state.loaded=0;truck.visible=true;truck.position.set(-5,0,7);ui()}};
document.querySelector('#reset').onclick=()=>{state={step:0,money:50000,loaded:0};truck.visible=true;truck.position.set(-5,0,7);ui();say('Yeni oyun başlatıldı')};ui();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
