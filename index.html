const GROUND_Y=0;

const Y_AXIS=new THREE.Vector3(0,1,0);
function flat(v){return new THREE.Vector3(v.x,GROUND_Y,v.z)}
function heading(from,to){return Math.atan2(to.x-from.x,to.z-from.z)}
function normalizeAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function rotateTo(obj,to,turnRate=4.8){return new Promise(resolve=>{
  const target=heading(obj.position,to), start=obj.rotation.y, delta=normalizeAngle(target-start);
  const duration=Math.max(70,Math.abs(delta)/turnRate*1000), t0=performance.now();
  function frame(now){const t=Math.min(1,(now-t0)/duration);obj.rotation.set(0,start+delta*t,0);obj.position.y=GROUND_Y;if(t<1)requestAnimationFrame(frame);else{obj.rotation.set(0,target,0);resolve()}}
  requestAnimationFrame(frame)
})}
async function driveSegment(obj,to,speed=12,onFrame=null,reverse=false){
  const b=flat(to); if(flat(obj.position).distanceTo(b)<.03)return;
  const faceTarget=reverse?new THREE.Vector3(obj.position.x-(b.x-obj.position.x),0,obj.position.z-(b.z-obj.position.z)):b;
  await rotateTo(obj,faceTarget,5.5);
  return new Promise(resolve=>{
    let last=performance.now();
    function frame(now){
      const dt=Math.min(.04,(now-last)/1000);last=now;
      const dx=b.x-obj.position.x,dz=b.z-obj.position.z,dist=Math.hypot(dx,dz);
      if(dist<=.04){obj.position.set(b.x,GROUND_Y,b.z);if(onFrame)onFrame();resolve();return}
      const step=Math.min(dist,speed*dt), inv=dist?1/dist:0;
      obj.position.x+=dx*inv*step;obj.position.z+=dz*inv*step;obj.position.y=GROUND_Y;
      if(onFrame)onFrame();requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
}

function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function loadGame(){try{let raw=localStorage.getItem(SAVE_KEY);if(!raw){const legacy=localStorage.getItem(LEGACY_SAVE_KEY);if(legacy){state=cleanState(JSON.parse(legacy));saveGame();return}}if(raw)state=cleanState(JSON.parse(raw))}catch(e){try{localStorage.removeItem(SAVE_KEY)}catch(_){ }state=cleanState(null)}}
function syncWorkers(){while(workerMeshes.length>2){const w=workerMeshes.pop();scene.remove(w)}const spots=[[-1,3,.1],[5,2,-.2],[9,4,.4],[-18,3,-.3]];for(let n=3;n<=state.workers;n++){const sp=spots[(n-3)%spots.length];createWorker(sp[0],sp[1],sp[2])}expansion.visible=state.depotLevel>=2}

let operationBusy=false;
const upgrade=document.querySelector('#upgrade'),hire=document.querySelector('#hire'),facilityPill=document.querySelector('#facilityPill');
const main=document.querySelector('#main'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),bar=document.querySelector('#bar'),money=document.querySelector('#money'),toast=document.querySelector('#toast'),jobsEl=document.querySelector('#jobs'),econ=document.querySelector('#econ');
const workPanel=document.querySelector('#workPanel'),panelToggle=document.querySelector('#panelToggle');let panelCollapsed=localStorage.getItem('yuk_hatti_panel')==='1';function syncPanel(){workPanel.classList.toggle('collapsed',panelCollapsed);panelToggle.textContent=panelCollapsed?'›':'‹'}panelToggle.onclick=()=>{panelCollapsed=!panelCollapsed;localStorage.setItem('yuk_hatti_panel',panelCollapsed?'1':'0');syncPanel()};syncPanel();
const advisor=document.querySelector('#advisor'),advisorText=document.querySelector('#advisorText'),advisorOk=document.querySelector('#advisorOk');
const GUIDE=[
 'Önce İş Merkezi’nden bir sevkiyat seç. Net kazanç, yakıt ve yol giderini karşılaştır.',
 'İşi kabul ettin. Yüklemeyi başlat; forklift yükü kamyona hazırlayacak.',
 'Yük hazır. Sefere Çık ile teslimatı başlat.',
 'Teslimat tamamlanınca Hesabı Kapat. Gelir ve giderler şirket kasasına işlenecek.',
 'Kazancın arttıkça çalışan alabilirsin. Daha fazla çalışan yüklemeyi hızlandırır.',
 'Yeterli paran olduğunda tesisi genişlet. Yeni yükleme kanadı sahada fiziksel olarak açılır.'
];
function guideShow(i){if(i<0||i>=GUIDE.length)return;state.guideStep=i;advisorText.textContent=GUIDE[i];advisor.classList.remove('hidden');saveGame()}
function guideHide(){advisor.classList.add('hidden')}
function guideForState(){if(state.guideStep>=GUIDE.length){guideHide();return}if(state.completed===0){if(state.step===0&&state.guideStep<=0)return guideShow(0);if(state.step===1&&state.guideStep<=1)return guideShow(1);if(state.step===2&&state.guideStep<=2)return guideShow(2);if(state.step===4&&state.guideStep<=3)return guideShow(3)}if(state.completed>=1&&state.workers===2&&state.guideStep<=4)return guideShow(4);if(state.money>=18000&&state.depotLevel===1&&state.guideStep<=5)return guideShow(5);guideHide()}
advisorOk.onclick=()=>{state.guideStep=Math.min(GUIDE.length,state.guideStep+1);guideHide();saveGame()};
const levelText=document.querySelector('#levelText'),repText=document.querySelector('#repText'),xpFill=document.querySelector('#xpFill'),goalText=document.querySelector('#goalText'),rankText=document.querySelector('#rankText');
function companyLevel(){return Math.max(1,Math.floor(state.xp/100)+1)}
function rankName(){const l=companyLevel();return l>=8?'Bölgesel Lojistik':l>=5?'Büyüyen Taşımacı':l>=3?'Profesyonel Nakliyeci':'Yerel Nakliyeci'}
function progressionUI(){const l=companyLevel(),within=state.xp%100;levelText.textContent=`Seviye ${l}`;repText.textContent=`İtibar ${state.reputation}`;xpFill.style.width=within+'%';rankText.textContent=rankName();const target=state.completed<3?`${3-state.completed} iş daha tamamla`:state.depotLevel<2?'Tesisi genişlet':state.workers<4?'Ekibini 4 çalışana çıkar':'Şirketini büyütmeye devam et';goalText.textContent=`Hedef: ${target} • Seri ${state.streak}`;}
function rewardCompletedJob(j,net){const xpGain=20+Math.round(j.distance/12)+j.pallets*2;const repGain=Math.max(1,Math.round(j.distance/45)+1);state.xp+=xpGain;state.reputation+=repGain;state.streak++;state.bestProfit=Math.max(state.bestProfit,net);return {xpGain,repGain}}
function tl(n){return '₺'+Math.round(n).toLocaleString('tr-TR')}

// V1 GÖRSEL 5 — hafif WebAudio ses/efekt sistemi. Harici ses dosyası yok.
let audioCtx=null,audioOn=localStorage.getItem('yuk_hatti_sound')!=='0',masterGain=null,ambientNode=null,ambientGain=null;
function ensureAudio(){if(!audioOn)return null;if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=.22;masterGain.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq=220,dur=.12,type='sine',vol=.18,slide=0){const c=ensureAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),c.currentTime+dur);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(masterGain);o.start();o.stop(c.currentTime+dur+.02)}
function thump(){tone(78,.12,'triangle',.28,-18);setTimeout(()=>tone(130,.08,'square',.08,-35),45)}
function beepReverse(){tone(880,.10,'square',.10);setTimeout(()=>tone(880,.10,'square',.10),210)}
function gateSound(){tone(150,.22,'sawtooth',.07,70)}
function enginePulse(kind='truck'){const base=kind==='fork'?105:72;tone(base,.32,'sawtooth',.07,kind==='fork'?25:16);tone(base*2,.26,'triangle',.035,10)}
function startAmbient(){const c=ensureAudio();if(!c||ambientNode)return;ambientNode=c.createOscillator();ambientGain=c.createGain();ambientNode.type='sine';ambientNode.frequency.value=48;ambientGain.gain.value=.012;ambientNode.connect(ambientGain);ambientGain.connect(masterGain);ambientNode.start()}
function stopAmbient(){if(ambientNode){try{ambientNode.stop()}catch(e){}ambientNode=null;ambientGain=null}}
const soundBtn=document.createElement('button');soundBtn.textContent=audioOn?'🔊 Ses':'🔇 Ses';soundBtn.style.cssText='position:fixed;right:14px;bottom:48px;z-index:30;background:#102733;color:#fff;border:1px solid #ffffff44;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer';document.body.appendChild(soundBtn);soundBtn.onclick=()=>{audioOn=!audioOn;localStorage.setItem('yuk_hatti_sound',audioOn?'1':'0');soundBtn.textContent=audioOn?'🔊 Ses':'🔇 Ses';if(audioOn){ensureAudio();startAmbient();tone(520,.08,'sine',.08)}else stopAmbient()};
addEventListener('pointerdown',()=>{ensureAudio();startAmbient()},{once:true});

function say(s){toast.textContent=s;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1700)}
function renderJobs(){jobsEl.innerHTML='';JOBS.forEach((j,i)=>{const need=[1,2,3][i],locked=companyLevel()<need;const e=document.createElement('div');e.className='job'+(state.selected===i&&!locked?' selected':'');e.style.opacity=locked?'.45':'1';e.innerHTML=`<div><strong>${j.name}${locked?' 🔒':''}</strong><br><span>${j.route} • ${j.pallets} palet • ${j.distance} km${locked?' • Seviye '+need:''}</span></div><em>${locked?'Kilitli':'Net '+tl(jobNet(j))}</em>`;e.onclick=()=>{if(state.step!==0||locked)return;state.selected=i;ui()};jobsEl.appendChild(e)})}
function economyLine(j){const wage=state.workers*450;econ.innerHTML=j?`<span>Gelir ${tl(j.revenue)}</span><span>Yakıt −${tl(j.fuel)}</span><span>Yol −${tl(j.road)}</span><span>Maaş −${tl(wage)}</span><span>Kasa neti ${tl(jobNet(j))}</span>`:`<span>Tamamlanan ${state.completed}</span><span>Toplam gelir ${tl(state.totalRevenue)}</span><span>Toplam gider ${tl(state.totalExpense)}</span>`}
function ui(){
 progressionUI(); money.textContent=tl(state.money); expansion.visible=state.depotLevel>=2; facilityPill.textContent=state.depotLevel>=2?'GENİŞ TESİS':'TEMEL TESİS'; upgrade.textContent=state.depotLevel>=2?'Tesis Genişletildi':'Tesisi Genişlet · ₺18.000'; upgrade.disabled=state.depotLevel>=2||state.money<18000||state.step!==0; hire.textContent=`Çalışan İşe Al · ₺3.500 (${state.workers})`; hire.disabled=state.money<3500||state.step!==0||state.workers>=6; const j=state.activeJob||JOBS[state.selected];
 jobsEl.classList.toggle('hidden',state.step!==0);
 if(state.step===0){title.textContent='İş Merkezi';desc.textContent='Bir sevkiyat seç. Kazanç, yakıt ve yol giderlerini gör.';main.textContent='İşi Kabul Et';main.disabled=false;bar.style.width='0%';renderJobs();economyLine(null);econ.innerHTML+=`<span>Çalışan ${state.workers}</span><span>İş başı maaş −${tl(state.workers*450)}</span>`;saveGame();guideForState();return}
 economyLine(j);
 if(state.step===1){title.textContent=j.name;desc.textContent=`${j.cargo} yükleniyor: ${state.loaded}/${j.pallets} palet`;main.textContent='Yüklemeyi Başlat';main.disabled=false;bar.style.width=(state.loaded/j.pallets*100)+'%'}
 else if(state.step===2){title.textContent='Yük Hazır';desc.textContent=`${j.route} • ${j.distance} km • Kasa neti ${tl(jobNet(j))}`;main.textContent='Sefere Çık';main.disabled=false;bar.style.width='100%'}
 else if(state.step===3){title.textContent='Seferde';desc.textContent=`ZAZOHAN YH-10 ${j.route} hattında ilerliyor…`;main.textContent='Sefer Sürüyor';main.disabled=true;bar.style.width='100%'}
 else if(state.step===4){title.textContent='Teslimat Tamamlandı';desc.textContent=`${tl(j.revenue)} gelir − ${tl(j.fuel+j.road)} yol/yakıt − ${tl(state.workers*450)} maaş = ${tl(jobNet(j))} kasa neti.`;main.textContent='Hesabı Kapat';main.disabled=false;bar.style.width='100%'};saveGame();guideForState()
}
async function runLoadingEconomy(){
 if(operationBusy)return; operationBusy=true; await cineLoading(); main.disabled=true; const j=state.activeJob; const trips=Math.max(1,Math.min(3,j.pallets)-Math.floor((state.workers-2)/2)); let shown=0;
 for(let trip=0;trip<trips;trip++){await loadOnePallet(trip);shown=Math.round((trip+1)/trips*j.pallets);state.loaded=Math.min(j.pallets,shown);bar.style.width=(state.loaded/j.pallets*100)+'%';desc.textContent=`${j.cargo} yükleniyor: ${state.loaded}/${j.pallets} palet`}
 state.step=2;operationBusy=false;main.disabled=false;tone(620,.10,'sine',.10,140);say(`${j.pallets} palet hazır`);ui();await cineTruckReady();setTimeout(()=>{if(!operationBusy)cameraRestore(520)},650)
}
async function runTruckDepartureEconomy(){if(operationBusy)return;operationBusy=true;enginePulse('truck');gateSound();state.step=3;ui();await cineDepartureStart();const path=[new THREE.Vector3(-7,0,11),new THREE.Vector3(1,0,13),new THREE.Vector3(12,0,17),new THREE.Vector3(30,0,20)];await drivePath(truck,path,15,followTruckCamera);truck.visible=false;await cameraRestore(520);setTimeout(()=>{operationBusy=false;state.step=4;ui();tone(520,.12,'sine',.10,180);setTimeout(()=>tone(760,.14,'sine',.09,120),130);say('Teslimat tamamlandı')},180)}
main.onclick=()=>{
 if(operationBusy)return;
 if(state.step===0){const need=[1,2,3][state.selected];if(companyLevel()<need){say(`Bu iş Seviye ${need} istiyor`);return}state.activeJob={...JOBS[state.selected]};state.loaded=0;bar.style.width='0%';state.step=1;say(`İş kabul edildi: ${state.activeJob.route}`);ui();cineJobAccepted()}
 else if(state.step===1)runLoadingEconomy();
 else if(state.step===2)runTruckDepartureEconomy();
 else if(state.step===4){const j=state.activeJob;const wage=state.workers*450,net=jobNet(j);state.money+=net;state.completed++;state.totalRevenue+=j.revenue;state.totalExpense+=j.fuel+j.road+wage;const rw=rewardCompletedJob(j,net);state.activeJob=null;state.step=0;state.loaded=0;resetVehicles();say(`${tl(net)} net • +${rw.xpGain} XP • +${rw.repGain} itibar`);ui()}
};
upgrade.onclick=()=>{if(operationBusy||state.step!==0||state.depotLevel>=2)return;if(state.money<18000){say('Tesis genişletme için yeterli bakiye yok');return}state.money-=18000;state.depotLevel=2;state.xp+=35;state.reputation+=3;expansion.visible=true;saveGame();say('Yeni yükleme kanadı açıldı • +35 XP');ui()};

hire.onclick=()=>{if(operationBusy||state.step!==0||state.workers>=6)return;if(state.money<3500){say('Yeni çalışan için yeterli bakiye yok');return}state.money-=3500;state.workers++;state.xp+=10;const spots=[[-1,3,.1],[5,2,-.2],[9,4,.4],[-18,3,-.3]];const sp=spots[(state.workers-3)%spots.length];createWorker(sp[0],sp[1],sp[2]);saveGame();say(`Yeni çalışan sahaya katıldı · Toplam ${state.workers}`);ui()};
document.querySelector('#reset').onclick=()=>{if(operationBusy){say('Aktif işlem bitmeden yeni oyun başlatılamaz');return}if(!confirm('Tüm kayıt silinsin ve yeni oyun başlatılsın mı?'))return;try{[SAVE_KEY,LEGACY_SAVE_KEY,'yuk_hatti_gfx','yuk_hatti_panel','yuk_hatti_sound'].forEach(k=>localStorage.removeItem(k))}catch(e){}gfxMode='balanced';panelCollapsed=false;audioOn=true;soundBtn.textContent='🔊 Ses';stopAmbient();applyGraphics(gfxMode);syncPanel();state=cleanState(null);syncWorkers();resetVehicles();ui();saveGame();say('Kayıt silindi · yeni şirket hesabı başlatıldı')};loadGame();syncWorkers();resetVehicles();ui();saveGame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);applyGraphics(gfxMode)});renderer.setAnimationLoop(()=>{controls.update();animateFacility();renderer.render(scene,camera)});
</script></body></html>
