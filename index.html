<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>YH-10 206K vs 10K</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#20242a;font-family:Arial}#info{position:fixed;left:12px;top:12px;z-index:2;background:#000c;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4}button{margin-top:7px;border:0;border-radius:7px;padding:7px 10px;background:#f4b400;font-weight:700}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="info"><b>ZAZOHAN YH-10 KARŞILAŞTIRMA</b><br>Sol: 206.786 üçgen • Sağ: ~9.886 üçgen<br>Sürükle: döndür • Teker/pinch: yakınlaştır<br><button id="wire">Tel görünümü</button></div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xadb4bc);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x46505b,1.7));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(5,8,6);sun.castShadow=true;scene.add(sun);const fill=new THREE.DirectionalLight(0xcadfff,1);fill.position.set(-6,4,-3);scene.add(fill);const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,20),new THREE.MeshStandardMaterial({color:0x777d83,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(30,30,0x31363b,0x555b61);grid.position.y=.003;scene.add(grid);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.8,0);camera.position.set(5.8,3.2,7.5);let mats=[];let loaded=0;
function load(url,x){new GLTFLoader().load(url,g=>{const m=g.scene;m.traverse(o=>{if(o.isMesh){o.geometry?.deleteAttribute('color');if(o.geometry&&!o.geometry.getAttribute('normal'))o.geometry.computeVertexNormals();o.material=new THREE.MeshStandardMaterial({color:0xb9bec4,roughness:.55,metalness:.05,vertexColors:false,side:THREE.DoubleSide});mats.push(o.material);o.castShadow=true;o.receiveShadow=true}});let b=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(sz);b.getCenter(c);m.position.sub(c);const s=3.7/Math.max(sz.x,sz.z);m.scale.setScalar(s);b=new THREE.Box3().setFromObject(m);b.getSize(sz);m.position.y+=sz.y/2;m.position.x+=x;scene.add(m);loaded++;},undefined,e=>console.error(url,e))}load('./YH10_206K.glb',-2.2);load('./YH10_10K.glb',2.2);document.getElementById('wire').onclick=()=>{mats.forEach(m=>m.wireframe=!m.wireframe)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});</script></body></html>
