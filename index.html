const GROUND_Y=0;
const forkHome=new THREE.Vector3(7,0,5);
const truckStart=new THREE.Vector3(-7,0,6);
const Y_AXIS=new THREE.Vector3(0,1,0);
function flat(v){return new THREE.Vector3(v.x,GROUND_Y,v.z)}
function heading(from,to){return Math.atan2(to.x-from.x,to.z-from.z)}
function normalizeAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function rotateTo(obj,to,turnRate=4.8){return new Promise(resolve=>{
  const target=heading(obj.position,to), start=obj.rotation.y, delta=normalizeAngle(target-start);
  const duration=Math.max(70,Math.abs(delta)/turnRate*1000), t0=performance.now();
  function frame(now){const t=Math.min(1,(now-t0)/duration);obj.rotation.set(0,start+delta*t,0);obj.position.y=GROUND_Y;if(t<1)requestAnimationFrame(frame);else{obj.rotation.set(0,target,0);resolve()}}
  requestAnimationFrame(frame)
})}
async function driveSegment(obj,to,speed=12,onFrame=null,reverse=false){
  const b=flat(to); if(flat(obj.position).distanceTo(b)<.03)return;
  const faceTarget=reverse?new THREE.Vector3(obj.position.x-(b.x-obj.position.x),0,obj.position.z-(b.z-obj.position.z)):b;
  await rotateTo(obj,faceTarget,5.5);
  return new Promise(resolve=>{
    let last=performance.now();
    function frame(now){
      const dt=Math.min(.04,(now-last)/1000);last=now;
      const dx=b.x-obj.position.x,dz=b.z-obj.position.z,dist=Math.hypot(dx,dz);
      if(dist<=.04){obj.position.set(b.x,GROUND_Y,b.z);if(onFrame)onFrame();resolve();return}
      const step=Math.min(dist,speed*dt), inv=dist?1/dist:0;
      obj.position.x+=dx*inv*step;obj.position.z+=dz*inv*step;obj.position.y=GROUND_Y;
      if(onFrame)onFrame();requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)
  })
}
async function drivePath(obj,points,speed,onFrame=null){for(const p of points)await driveSegment(obj,p,speed,onFrame)}

function ui(){
 money.textContent=tl(state.money); expansion.visible=state.depotLevel>=2; facilityPill.textContent=state.depotLevel>=2?'GENİŞ TESİS':'TEMEL TESİS'; upgrade.textContent=state.depotLevel>=2?'Tesis Genişletildi':'Tesisi Genişlet · ₺18.000'; upgrade.disabled=state.depotLevel>=2||state.money<18000||state.step!==0; hire.textContent=`Çalışan İşe Al · ₺3.500 (${state.workers})`; hire.disabled=state.money<3500||state.step!==0||state.workers>=6; const j=state.activeJob||JOBS[state.selected];
 jobsEl.classList.toggle('hidden',state.step!==0);
 if(state.step===0){title.textContent='İş Merkezi';desc.textContent='Bir sevkiyat seç. Kazanç, yakıt ve yol giderlerini gör.';main.textContent='İşi Kabul Et';main.disabled=false;bar.style.width='0%';renderJobs();economyLine(null);econ.innerHTML+=`<span>Çalışan ${state.workers}</span><span>İş başı maaş −${tl(state.workers*450)}</span>`;saveGame();guideForState();return}
 economyLine(j);
 if(state.step===1){title.textContent=j.name;desc.textContent=`${j.cargo} yükleniyor: ${state.loaded}/${j.pallets} palet`;main.textContent='Yüklemeyi Başlat';main.disabled=false;bar.style.width=(state.loaded/j.pallets*100)+'%'}
 else if(state.step===2){title.textContent='Yük Hazır';desc.textContent=`${j.route} • ${j.distance} km • Kasa neti ${tl(j.net-state.workers*450)}`;main.textContent='Sefere Çık';main.disabled=false;bar.style.width='100%'}
 else if(state.step===3){title.textContent='Seferde';desc.textContent=`ZAZOHAN YH-10 ${j.route} hattında ilerliyor…`;main.textContent='Sefer Sürüyor';main.disabled=true;bar.style.width='100%'}
 else if(state.step===4){title.textContent='Teslimat Tamamlandı';desc.textContent=`${tl(j.revenue)} gelir − ${tl(j.fuel+j.road)} yol/yakıt − ${tl(state.workers*450)} maaş = ${tl(j.net-state.workers*450)} kasa neti.`;main.textContent='Hesabı Kapat';main.disabled=false;bar.style.width='100%'};saveGame();guideForState()
}
async function runLoadingEconomy(){
 if(operationBusy)return; operationBusy=true; main.disabled=true; const j=state.activeJob; const trips=Math.max(1,Math.min(3,j.pallets)-Math.floor((state.workers-2)/2)); let shown=0;
 for(let trip=0;trip<trips;trip++){await loadOnePallet(trip);shown=Math.round((trip+1)/trips*j.pallets);state.loaded=Math.min(j.pallets,shown);bar.style.width=(state.loaded/j.pallets*100)+'%';desc.textContent=`${j.cargo} yükleniyor: ${state.loaded}/${j.pallets} palet`}
 state.step=2;operationBusy=false;main.disabled=false;say(`${j.pallets} palet hazır`);ui()
}
async function runTruckDepartureEconomy(){if(operationBusy)return;operationBusy=true;state.step=3;ui();const path=[new THREE.Vector3(-7,0,11),new THREE.Vector3(1,0,13),new THREE.Vector3(12,0,17),new THREE.Vector3(30,0,20)];await drivePath(truck,path,15);truck.visible=false;setTimeout(()=>{operationBusy=false;state.step=4;ui();say('Teslimat tamamlandı')},180)}
main.onclick=()=>{
 if(operationBusy)return;
 if(state.step===0){state.activeJob={...JOBS[state.selected]};state.loaded=0;bar.style.width='0%';state.step=1;say(`İş kabul edildi: ${state.activeJob.route}`);ui()}
 else if(state.step===1)runLoadingEconomy();
 else if(state.step===2)runTruckDepartureEconomy();
 else if(state.step===4){const j=state.activeJob;const wage=state.workers*450;state.money+=j.net-wage;state.completed++;state.totalRevenue+=j.revenue;state.totalExpense+=j.fuel+j.road+wage;state.activeJob=null;state.step=0;state.loaded=0;resetVehicles();say(`${tl(j.net-wage)} maaş sonrası net kazanç kasaya işlendi`);ui()}
};
upgrade.onclick=()=>{if(operationBusy||state.step!==0||state.depotLevel>=2)return;if(state.money<18000){say('Tesis genişletme için yeterli bakiye yok');return}state.money-=18000;state.depotLevel=2;expansion.visible=true;saveGame();say('Yeni yükleme kanadı hizmete açıldı');ui()};

hire.onclick=()=>{if(operationBusy||state.step!==0||state.workers>=6)return;if(state.money<3500){say('Yeni çalışan için yeterli bakiye yok');return}state.money-=3500;state.workers++;const spots=[[-1,3,.1],[5,2,-.2],[9,4,.4],[-18,3,-.3]];const sp=spots[(state.workers-3)%spots.length];createWorker(sp[0],sp[1],sp[2]);saveGame();say(`Yeni çalışan sahaya katıldı · Toplam ${state.workers}`);ui()};
document.querySelector('#reset').onclick=()=>{if(operationBusy){say('Aktif işlem bitmeden yeni oyun başlatılamaz');return}if(!confirm('Tüm kayıt silinsin ve yeni oyun başlatılsın mı?'))return;try{localStorage.removeItem(SAVE_KEY)}catch(e){}state=cleanState(null);syncWorkers();resetVehicles();ui();saveGame();say('Kayıt silindi · yeni şirket hesabı başlatıldı')};loadGame();syncWorkers();resetVehicles();ui();saveGame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);applyGraphics(gfxMode)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
