<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAZO TYCOON V4 — Production & Trade Engine</title>
<style>
*{box-sizing:border-box}:root{--bg:#06121b;--p:#0b202d;--p2:#102a39;--g:#e5b94f;--g2:#ffe09a;--t:#eef6fb;--m:#91aab7;--ok:#5be08d;--bad:#ff7c7c}
body{margin:0;background:#06121b;color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1500px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 0,#173a50,#071722 55%)}
button,input,select{font:inherit}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#07141e;border-bottom:1px solid #725d2d;position:sticky;top:0;z-index:20}.brand{font-weight:950;color:var(--g2);font-size:20px}.brand small{display:block;color:#9fb4bf;font-size:9px;letter-spacing:3px}.resources{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.pill,.btn{border:1px solid #445b65;background:#0c2230;color:var(--t);border-radius:9px;padding:9px 11px}.pill b{color:var(--g2)}button{cursor:pointer}.reset{border-color:#7f4141;color:#ffc0c0}.layout{display:grid;grid-template-columns:180px minmax(0,1fr)}aside{background:#081823;border-right:1px solid #725d2d;padding:9px}.nav{display:grid;gap:7px}.nav button{border:1px solid #66542e;background:linear-gradient(145deg,#0b1c28,#102b3b);color:var(--t);border-radius:10px;padding:11px;text-align:left}.nav button.active{border-color:var(--g2);background:linear-gradient(90deg,#6b4912,#112c3b)}
main{min-width:0;padding-bottom:12px}.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 14px}.head h1{margin:0;color:var(--g2);font-size:25px}.head p{margin:3px 0;color:var(--m)}.head .status{margin-left:auto}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 14px 12px}.card{background:#0b202d;border:1px solid #294654;border-radius:11px;padding:11px}.card small{color:var(--m)}.card strong{display:block;color:var(--g2);margin-top:5px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:0 14px 12px}.tabs button{min-height:48px;border:1px solid #66542e;background:#0b1d29;color:var(--t);border-radius:10px}.tabs button.active{border-color:var(--g2);background:#5e4217}
.workspace{margin:0 14px;border:1px solid #745e2d;border-radius:14px;background:linear-gradient(145deg,#0a1c28,#0d2735);padding:14px;min-height:360px}.workspace h2{color:var(--g2);margin:0 0 5px}.muted{color:var(--m)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{background:#081b26;border:1px solid #294654;border-radius:11px;padding:12px}.panel h3{margin:0 0 10px;color:var(--g2)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px;border-bottom:1px solid #1e3946}.row:last-child{border:0}.green{color:var(--ok)}.red{color:var(--bad)}.form{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:10px}.form select,.form input{min-width:0;background:#071720;color:var(--t);border:1px solid #435a65;border-radius:8px;padding:10px}.action{background:linear-gradient(#9a7227,#6b4b16);border:1px solid var(--g2);color:#fff3c7;border-radius:9px;padding:10px;font-weight:800}.log{max-height:250px;overflow:auto}.logline{font-size:12px;padding:7px 0;border-bottom:1px solid #1c3440}.manager{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.switch{padding:9px 12px;border-radius:9px;border:1px solid #4d6570;background:#102a37;color:white}.switch.on{border-color:var(--ok);color:var(--ok)}
.companies{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:12px 14px;border-top:1px solid #725d2d}.company{border:1px solid #465b65;background:#0b1e2a;color:white;border-radius:9px;padding:9px;text-align:left}.company.active{border-color:var(--g2)}.company b{display:block}.company small{color:var(--m)}.toast{display:none;position:fixed;right:14px;bottom:14px;background:#102b38;border:1px solid #9a7b36;padding:11px 14px;border-radius:10px;z-index:50}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.tabs{grid-template-columns:repeat(3,1fr)}.companies{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #725d2d}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:11px;padding:8px 3px}.stats{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.companies{grid-template-columns:repeat(2,1fr)}.resources{margin-left:0}.form{grid-template-columns:1fr 90px}.form .action{grid-column:1/-1}.head h1{font-size:21px}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand">♛ ZAZO TYCOON V4<small>PRODUCTION & TRADE ENGINE</small></div><div class="resources"><div class="pill">Holding <b id="holding"></b></div><div class="pill">Gün <b id="day"></b></div><button class="pill reset" id="reset">↻ Verileri Sıfırla</button></div></header>
<div class="layout"><aside><div class="nav"><button class="active">🏢 Şirketlerim</button><button>🏦 Banka</button><button>📈 Yatırım</button><button>🛒 Pazar</button><button>🚚 Araçlar</button><button>♛ Holding</button><button>📊 Raporlar</button><button>⚙️ Ayarlar</button></div></aside>
<main>
<div class="head"><div><h1 id="name">ZAZO TEKSTİL</h1><p>Tekstil • Üretim → Depo → Mağaza → Satış</p></div><div class="status pill">Müdür: <b id="managerStatus">Pasif</b></div></div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<section class="workspace" id="workspace"></section>
</main></div>
<div class="companies" id="companies"></div>
</div><div class="toast" id="toast"></div>
<script>
const KEY='zazoTycoonV4';
const DEFAULT_STATE=()=>({holding:320400000,day:287,current:0,manager:false,managerSalary:85000,
raw:{pamuk:0,iplik:0,kumas:0},warehouse:{tisort:0,gomlek:0,pantolon:0},store:{tisort:0,gomlek:0,pantolon:0},
cash:125000000,warehouseLevel:1,factoryLevel:1,storeLevel:1,
totals:{revenue:0,rawCost:0,productionCost:0,salary:0,logistics:0,net:0,holding:0},logs:[]});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||DEFAULT_STATE()}catch(e){S=DEFAULT_STATE()}
const companies=[['ZAZO TEKSTİL','🧵'],['ZAZO İNŞAAT','🏗️'],['ZAZO GIDA','🥫'],['ZAZO OTOMOTİV','🚗'],['ZAZO TEKNOLOJİ','💻'],['ZAZO LOJİSTİK','🚚'],['ZAZO HAVACILIK','✈️'],['ZAZO UZAY','🚀'],['ZAZO ENERJİ','⚡'],['ZAZO MADENCİLİK','⛏️']];
const rawPrice={pamuk:28.5,iplik:41.2,kumas:62.4};
const recipes={tisort:{label:'Tişört',need:{pamuk:2,iplik:1},cost:18,sell:190},gomlek:{label:'Gömlek',need:{kumas:2,iplik:1},cost:28,sell:310},pantolon:{label:'Pantolon',need:{kumas:3,iplik:1},cost:38,sell:420}};
const money=n=>'₺'+Math.round(n).toLocaleString('tr-TR'); const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function toast(x){let e=document.querySelector('#toast');e.textContent=x;e.style.display='block';clearTimeout(window.zz);window.zz=setTimeout(()=>e.style.display='none',2200)}
function stats(){let capacity=10000*S.warehouseLevel;let used=Object.values(S.raw).reduce((a,b)=>a+b,0)+Object.values(S.warehouse).reduce((a,b)=>a+b,0);let arr=[['Şirket Kasası',money(S.cash)],['Holding',money(S.holding)],['Depo',used.toLocaleString('tr-TR')+' / '+capacity.toLocaleString('tr-TR')],['Toplam Ciro',money(S.totals.revenue)],['Net Kâr',money(S.totals.net)],['Holding Payı',money(S.totals.holding)]];document.querySelector('#stats').innerHTML=arr.map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')}
const tabs=[['🛒','Hammadde'],['🏭','Fabrika'],['📦','Depo'],['🏪','Mağaza'],['👔','Müdür'],['📊','Muhasebe']];let tab='Hammadde';
function renderTabs(){document.querySelector('#tabs').innerHTML=tabs.map(x=>'<button data-tab="'+x[1]+'" class="'+(tab===x[1]?'active':'')+'">'+x[0]+' '+x[1]+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderWorkspace();renderTabs()})}
function rows(o,labeler=(k)=>k){return Object.entries(o).map(([k,v])=>'<div class="row"><span>'+labeler(k)+'</span><b>'+Number(v).toLocaleString('tr-TR')+'</b></div>').join('')}
function renderWorkspace(){let w=document.querySelector('#workspace');
if(tab==='Hammadde')w.innerHTML='<h2>🛒 Hammadde Pazarı</h2><div class="muted">Hammadde şirket kasasından alınır ve gerçek depo stokuna girer.</div><div class="cols"><div class="panel"><h3>Güncel Fiyatlar</h3>'+Object.entries(rawPrice).map(([k,v])=>'<div class="row"><span>'+k.toUpperCase()+'</span><b>'+money(v)+'/birim</b></div>').join('')+'</div><div class="panel"><h3>Satın Al</h3><div class="form"><select id="rawType"><option value="pamuk">Pamuk</option><option value="iplik">İplik</option><option value="kumas">Kumaş</option></select><input id="rawQty" type="number" min="1" value="100"><button class="action" id="buyRaw">Satın Al</button></div><h3 style="margin-top:18px">Stok</h3>'+rows(S.raw,k=>k.toUpperCase())+'</div></div>';
else if(tab==='Fabrika')w.innerHTML='<h2>🏭 Fabrika — Seviye '+S.factoryLevel+'</h2><div class="muted">Üretim hammaddeleri tüketir, üretim maliyeti kasadan düşer ve ürün depoya girer.</div><div class="cols"><div class="panel"><h3>Reçeteler</h3>'+Object.entries(recipes).map(([k,r])=>'<div class="row"><span>'+r.label+'</span><small>'+Object.entries(r.need).map(x=>x[1]+' '+x[0]).join(' + ')+' • '+money(r.cost)+' üretim</small></div>').join('')+'</div><div class="panel"><h3>Üret</h3><div class="form"><select id="prodType">'+Object.entries(recipes).map(([k,r])=>'<option value="'+k+'">'+r.label+'</option>').join('')+'</select><input id="prodQty" type="number" min="1" value="10"><button class="action" id="produce">Üret</button></div><h3 style="margin-top:18px">Ürün Deposu</h3>'+rows(S.warehouse,k=>recipes[k].label)+'</div></div>';
else if(tab==='Depo')w.innerHTML='<h2>📦 Depo — Seviye '+S.warehouseLevel+'</h2><div class="muted">Üretilen ürünleri mağazaya sevk et. Her sevkiyatın lojistik gideri vardır.</div><div class="cols"><div class="panel"><h3>Depodaki Ürünler</h3>'+rows(S.warehouse,k=>recipes[k].label)+'</div><div class="panel"><h3>Mağazaya Sevk</h3><div class="form"><select id="shipType">'+Object.entries(recipes).map(([k,r])=>'<option value="'+k+'">'+r.label+'</option>').join('')+'</select><input id="shipQty" type="number" min="1" value="10"><button class="action" id="ship">Sevk Et</button></div><div class="muted" style="margin-top:10px">Lojistik: ₺4 / ürün</div></div></div>';
else if(tab==='Mağaza')w.innerHTML='<h2>🏪 Mağaza — Seviye '+S.storeLevel+'</h2><div class="muted">Mağazadaki gerçek stok satılır. Satılan ürün mağaza stokundan düşer.</div><div class="cols"><div class="panel"><h3>Mağaza Stoku</h3>'+rows(S.store,k=>recipes[k].label)+'</div><div class="panel"><h3>Manuel Satış</h3><div class="form"><select id="saleType">'+Object.entries(recipes).map(([k,r])=>'<option value="'+k+'">'+r.label+' • '+money(r.sell)+'</option>').join('')+'</select><input id="saleQty" type="number" min="1" value="5"><button class="action" id="sell">Sat</button></div></div></div>';
else if(tab==='Müdür')w.innerHTML='<h2>👔 Müdür Otomasyonu</h2><div class="manager panel"><div><b>Tekstil Müdürü</b><div class="muted">Maaş: '+money(S.managerSalary)+'/oyun günü</div></div><button id="managerToggle" class="switch '+(S.manager?'on':'')+'">'+(S.manager?'✓ Otomasyon Açık':'Otomasyonu Aç')+'</button></div><div class="panel" style="margin-top:12px"><h3>Otomatik görevler</h3><div class="row"><span>Düşük hammaddeleri satın al</span><b>✓</b></div><div class="row"><span>Tişört üret</span><b>✓</b></div><div class="row"><span>Depodan mağazaya sevk et</span><b>✓</b></div><div class="row"><span>Mağaza stoklarını sat</span><b>✓</b></div></div>';
else w.innerHTML='<h2>📊 Gerçek Muhasebe</h2><div class="muted">Net kâr = satış − hammadde − üretim − maaş − lojistik. Pozitif net kârın %20’si Holding’e aktarılır.</div><div class="cols"><div class="panel"><h3>Toplamlar</h3><div class="row"><span>Satış Geliri</span><b class="green">'+money(S.totals.revenue)+'</b></div><div class="row"><span>Hammadde</span><b class="red">'+money(S.totals.rawCost)+'</b></div><div class="row"><span>Üretim</span><b class="red">'+money(S.totals.productionCost)+'</b></div><div class="row"><span>Maaş</span><b class="red">'+money(S.totals.salary)+'</b></div><div class="row"><span>Lojistik</span><b class="red">'+money(S.totals.logistics)+'</b></div><div class="row"><span>Net Kâr</span><b>'+money(S.totals.net)+'</b></div><div class="row"><span>Holding Aktarımı</span><b>'+money(S.totals.holding)+'</b></div></div><div class="panel"><h3>İşlem Geçmişi</h3><div class="log">'+(S.logs.length?S.logs.slice().reverse().map(x=>'<div class="logline">'+x+'</div>').join(''):'Henüz işlem yok.')+'</div></div></div>';
bind(); }
function log(x){S.logs.push('Gün '+S.day+' • '+x);if(S.logs.length>100)S.logs.shift()}
function recalcNet(){S.totals.net=S.totals.revenue-S.totals.rawCost-S.totals.productionCost-S.totals.salary-S.totals.logistics}
function buyRaw(type,qty,auto=false){qty=Math.max(1,Math.floor(qty));let used=Object.values(S.raw).reduce((a,b)=>a+b,0)+Object.values(S.warehouse).reduce((a,b)=>a+b,0),cap=10000*S.warehouseLevel;if(used+qty>cap){if(!auto)toast('Depo kapasitesi yetersiz');return false}let cost=rawPrice[type]*qty;if(S.cash<cost){if(!auto)toast('Şirket kasası yetersiz');return false}S.cash-=cost;S.raw[type]+=qty;S.totals.rawCost+=cost;recalcNet();log(qty+' '+type+' alındı • '+money(cost));return true}
function produce(type,qty,auto=false){qty=Math.max(1,Math.floor(qty));let r=recipes[type];for(let k in r.need)if(S.raw[k]<r.need[k]*qty){if(!auto)toast('Hammadde yetersiz');return false}let cost=r.cost*qty;if(S.cash<cost){if(!auto)toast('Üretim için kasa yetersiz');return false}for(let k in r.need)S.raw[k]-=r.need[k]*qty;S.cash-=cost;S.warehouse[type]+=qty;S.totals.productionCost+=cost;recalcNet();log(qty+' '+r.label+' üretildi • '+money(cost));return true}
function ship(type,qty,auto=false){qty=Math.max(1,Math.floor(qty));if(S.warehouse[type]<qty){if(!auto)toast('Depoda yeterli ürün yok');return false}let cost=qty*4;if(S.cash<cost)return false;S.warehouse[type]-=qty;S.store[type]+=qty;S.cash-=cost;S.totals.logistics+=cost;recalcNet();log(qty+' '+recipes[type].label+' mağazaya sevk edildi • '+money(cost));return true}
function sell(type,qty,auto=false){qty=Math.max(1,Math.floor(qty));qty=Math.min(qty,S.store[type]);if(qty<1){if(!auto)toast('Mağaza stoğu yok');return false}let revenue=recipes[type].sell*qty;S.store[type]-=qty;S.cash+=revenue;S.totals.revenue+=revenue;recalcNet();let operatingProfit=Math.max(0,revenue-(recipes[type].cost*qty));let hold=Math.round(operatingProfit*.20);hold=Math.min(hold,S.cash);S.cash-=hold;S.holding+=hold;S.totals.holding+=hold;log(qty+' '+recipes[type].label+' satıldı • '+money(revenue)+' • Holding '+money(hold));return true}
function bind(){let e;if(e=document.querySelector('#buyRaw'))e.onclick=()=>{let q=+document.querySelector('#rawQty').value;if(buyRaw(document.querySelector('#rawType').value,q)){save();renderAll();toast('Hammadde depoya girdi')}};if(e=document.querySelector('#produce'))e.onclick=()=>{if(produce(document.querySelector('#prodType').value,+document.querySelector('#prodQty').value)){save();renderAll();toast('Üretim tamamlandı')}};if(e=document.querySelector('#ship'))e.onclick=()=>{if(ship(document.querySelector('#shipType').value,+document.querySelector('#shipQty').value)){save();renderAll();toast('Ürün mağazaya sevk edildi')}};if(e=document.querySelector('#sell'))e.onclick=()=>{if(sell(document.querySelector('#saleType').value,+document.querySelector('#saleQty').value)){save();renderAll();toast('Satış tamamlandı')}};if(e=document.querySelector('#managerToggle'))e.onclick=()=>{S.manager=!S.manager;log('Müdür otomasyonu '+(S.manager?'açıldı':'kapatıldı'));save();renderAll()}}
function renderCompanies(){document.querySelector('#companies').innerHTML=companies.map((c,i)=>'<button class="company '+(i===S.current?'active':'')+'" data-c="'+i+'"><b>'+c[1]+' '+c[0]+'</b><small>'+(i===0?'Tam üretim motoru aktif':'Sektör motoru sonraki aşama')+'</small></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let i=+b.dataset.c;if(i!==0){toast('V4 üretim motoru şu anda ZAZO TEKSTİL’de aktif');return}S.current=0;save();renderCompanies()})}
function renderAll(){document.querySelector('#holding').textContent=money(S.holding);document.querySelector('#day').textContent=S.day;document.querySelector('#managerStatus').textContent=S.manager?'Aktif':'Pasif';stats();renderTabs();renderWorkspace();renderCompanies()}
document.querySelector('#reset').onclick=()=>{if(!confirm('TÜM V4 oyun verileri kesin olarak sıfırlansın mı?'))return;try{localStorage.clear()}catch(e){}S=DEFAULT_STATE();save();tab='Hammadde';renderAll();toast('Tüm oyun verileri başlangıç değerlerine sıfırlandı')};
setInterval(()=>{S.day++;if(S.manager){if(S.cash>=S.managerSalary){S.cash-=S.managerSalary;S.totals.salary+=S.managerSalary;log('Müdür maaşı ödendi • '+money(S.managerSalary))}if(S.raw.pamuk<300)buyRaw('pamuk',600,true);if(S.raw.iplik<200)buyRaw('iplik',400,true);produce('tisort',Math.min(100,Math.floor(S.raw.pamuk/2),S.raw.iplik),true);let q=Math.min(100,S.warehouse.tisort);if(q>0)ship('tisort',q,true);let sq=Math.min(60,S.store.tisort);if(sq>0)sell('tisort',sq,true)}recalcNet();save();renderAll()},30000);
renderAll();
</script></body></html>
