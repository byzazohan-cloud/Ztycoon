<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ZAZOHAN YH-10 Look V1</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#1d2228;font-family:Arial}#info{position:fixed;left:12px;top:12px;z-index:5;background:#000c;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}b{color:#ffc400}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="info"><b>ZAZOHAN YH-10 • GAME LOOK V1</b><br>10K mobil model • geçici oyun renkleri<br>Sürükle: döndür • Teker/pinch: yakınlaştır</div><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fa7af);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x3d4650,2.0));const sun=new THREE.DirectionalLight(0xffffff,2.7);sun.position.set(-4,7,5);sun.castShadow=true;scene.add(sun);const rim=new THREE.DirectionalLight(0xd9e8ff,1.2);rim.position.set(5,4,-5);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(25,18),new THREE.MeshStandardMaterial({color:0x656c73,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(25,25,0x33383d,0x51585f);grid.position.y=.003;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.05,0);camera.position.set(-5.5,3.1,6.2);
function col(hex){const c=new THREE.Color(hex);return [c.r,c.g,c.b]}
const WHITE=col(0xe8eaec), BLACK=col(0x101419), GLASS=col(0x182a38), TIRE=col(0x17191c), METAL=col(0x8d949b), YELLOW=col(0xffbd00);
new GLTFLoader().load('./ZAZOHAN_YH10_10K.glb',g=>{const root=g.scene;root.traverse(o=>{if(!o.isMesh)return;const geo=o.geometry.toNonIndexed();geo.computeVertexNormals();const p=geo.attributes.position;const arr=new Float32Array(p.count*3);for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);let C=WHITE;
// Model coordinates: X=length, Y=width, Z=height. Front is -X.
// low running gear / tyres
if(z<-0.15) C=TIRE;
// chassis and underbody
if(z>-0.17 && z<-0.04) C=BLACK;
// front fascia / grille
if(x<-0.63 && z>-0.16 && z<0.12) C=BLACK;
// windshield band and side-window zone on cab
if(x<-0.43 && z>0.10 && z<0.30) C=GLASS;
// metallic wheel-center hint near ground
if(z<-0.18 && Math.abs(y)>.20) C=METAL;
// yellow identity accent around lower cab / side rail
if(x<-0.30 && z>-0.06 && z<0.00) C=YELLOW;
arr[i*3]=C[0];arr[i*3+1]=C[1];arr[i*3+2]=C[2];}
geo.setAttribute('color',new THREE.BufferAttribute(arr,3));o.geometry=geo;o.material=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.48,metalness:.08,side:THREE.DoubleSide});o.castShadow=o.receiveShadow=true;});
let b=new THREE.Box3().setFromObject(root),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);b.getCenter(c);root.position.sub(c);const k=4.7/s.x;root.scale.setScalar(k);b=new THREE.Box3().setFromObject(root);b.getSize(s);root.position.y+=s.y/2;scene.add(root);
},undefined,e=>{document.getElementById('info').innerHTML+='<br>GLB yükleme hatası';console.error(e)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
