<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZAZO TYCOON Cinematic</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#030a10;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer}.game{max-width:1600px;margin:auto;background:#06131c;min-height:100vh;position:relative}.hud{height:58px;display:flex;align-items:center;gap:10px;padding:7px 14px;background:#06121ce8;border-bottom:1px solid #8d6d2e;position:sticky;top:0;z-index:30}.brand{font-weight:950;color:#ffe19a;font-size:20px;letter-spacing:.5px}.brand small{display:block;font-size:8px;letter-spacing:3px;color:#91a7b3}.hudStats{margin-left:auto;display:flex;gap:7px}.chip{background:#0a1d29d9;border:1px solid #435864;border-radius:8px;padding:7px 10px;font-size:12px}.chip b{color:#ffe19a}.world{position:relative;height:calc(100vh - 58px);min-height:610px;overflow:hidden;background:#102838 url('campus.png') center/cover no-repeat}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#020b12c9 0,#020b1250 16%,transparent 37%,transparent 72%,#020b1270),linear-gradient(0deg,#020b12d8 0,transparent 28%,#020b1248 100%);pointer-events:none}.left{position:absolute;left:12px;top:18px;bottom:105px;z-index:4;width:62px;display:flex;flex-direction:column;gap:8px}.nav{height:56px;border:1px solid #8d7136;border-radius:10px;background:#071824d9;backdrop-filter:blur(8px);font-size:22px;position:relative}.nav span{display:none;position:absolute;left:68px;top:8px;white-space:nowrap;background:#071824e8;border:1px solid #826a36;border-radius:7px;padding:9px;font-size:12px}.nav:hover span{display:block}.companyInfo{position:absolute;z-index:4;left:92px;top:22px;background:#06131cd9;border:1px solid #9a7934;border-radius:12px;padding:12px 15px;backdrop-filter:blur(8px)}.companyInfo h1{margin:0;color:#ffe19a;font-size:23px}.companyInfo p{margin:3px 0 0;color:#a8bbc5;font-size:12px}.miniStats{position:absolute;right:15px;top:18px;z-index:4;display:grid;grid-template-columns:repeat(2,150px);gap:7px}.mini{background:#06131cda;border:1px solid #465c66;border-radius:9px;padding:9px;backdrop-filter:blur(7px)}.mini small{display:block;color:#94aab5;font-size:10px}.mini b{font-size:13px;color:#ffe19a}.hotspots{position:absolute;z-index:4;inset:0;pointer-events:none}.spot{position:absolute;pointer-events:auto;border:1px solid #e4b84f;background:#07131ddd;border-radius:10px;padding:8px 11px;font-weight:800;box-shadow:0 5px 20px #0008}.spot small{display:block;color:#b3c3ca;font-weight:400;font-size:10px}.office{left:29%;top:45%}.factory{right:23%;top:47%}.warehouse{right:13%;top:64%}.store{left:46%;top:67%}.bottom{position:absolute;z-index:5;left:86px;right:12px;bottom:10px;display:grid;grid-template-columns:repeat(10,minmax(95px,1fr));gap:7px}.company{height:82px;border:1px solid #5a6970;border-radius:10px;background:#06131cdd;backdrop-filter:blur(9px);padding:8px;text-align:left}.company.active{border-color:#ffe19a;background:#594019dd}.company i{font-style:normal;font-size:20px}.company b{display:block;font-size:10px;margin-top:3px}.company small{font-size:9px;color:#a4b7c0}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:80;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.panel{width:min(850px,100%);max-height:86vh;overflow:auto;background:#081c28;border:1px solid #9a7835;border-radius:15px;padding:16px}.close{float:right;background:#132b37;border:1px solid #526872;border-radius:8px;padding:7px 10px}.panel h2{margin:0 0 4px;color:#ffe19a}.desc{color:#91a8b4;font-size:12px;margin-bottom:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#061720;border:1px solid #29434f;border-radius:10px;padding:11px}.box h3{color:#ffe19a;margin:0 0 9px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px;border-bottom:1px solid #1c3440}.row:last-child{border:0}.form{display:grid;grid-template-columns:1fr 100px auto;gap:7px;margin-top:9px}.form input,.form select{min-width:0;background:#04121a;border:1px solid #435a65;color:#fff;border-radius:8px;padding:9px}.action{border:1px solid #f0c85f;background:#76541b;border-radius:8px;padding:9px;font-weight:800}.toast{display:none;position:fixed;right:15px;bottom:15px;z-index:100;background:#0d2937;border:1px solid #9d7c38;border-radius:9px;padding:10px 13px}.reset{border-color:#814747;color:#ffbcbc}
@media(max-width:950px){.miniStats{grid-template-columns:repeat(2,120px)}.bottom{overflow-x:auto;grid-template-columns:repeat(10,110px)}}
@media(max-width:700px){.hud{height:auto}.hudStats{margin-left:0;flex-wrap:wrap}.world{height:780px}.companyInfo{left:80px}.miniStats{top:105px;right:8px;grid-template-columns:1fr}.left{top:110px}.bottom{left:8px}.spot{font-size:11px}.office{left:28%;top:49%}.factory{right:12%;top:52%}.warehouse{right:8%;top:66%}.store{left:42%;top:70%}.cols{grid-template-columns:1fr}.form{grid-template-columns:1fr 80px}.form .action{grid-column:1/-1}}
</style></head><body><div class="game"><header class="hud"><div class="brand">♛ ZAZO TYCOON<small>BUSINESS EMPIRE</small></div><div class="hudStats"><div class="chip">Holding <b id="holding"></b></div><div class="chip">Grup <b id="group"></b></div><div class="chip">Gün <b id="day"></b></div><button class="chip reset" id="reset">↻ Sıfırla</button></div></header>
<section class="world" id="world"><div class="left" id="nav"></div><div class="companyInfo"><h1 id="name"></h1><p id="sub"></p></div><div class="miniStats" id="stats"></div>
<div class="hotspots"><button class="spot office" data-area="office">🏢 OFİS<small>Şirket yönetimi</small></button><button class="spot factory" data-area="factory">🏭 FABRİKA<small>Üretime gir</small></button><button class="spot warehouse" data-area="warehouse">📦 DEPO<small>Stok & sevkiyat</small></button><button class="spot store" data-area="store">🏪 MAĞAZA<small>Satış merkezi</small></button></div>
<div class="bottom" id="companies"></div></section></div><div class="modal" id="modal"><div class="panel"><button class="close" id="close">✕</button><h2 id="mt"></h2><div class="desc" id="md"></div><div id="mb"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='zazoCinematicV1';const defs=[['ZAZO TEKSTİL','Tekstil','🧵'],['ZAZO İNŞAAT','İnşaat','🏗️'],['ZAZO GIDA','Gıda','🥫'],['ZAZO OTOMOTİV','Otomotiv','🚗'],['ZAZO TEKNOLOJİ','Teknoloji','💻'],['ZAZO LOJİSTİK','Lojistik','🚚'],['ZAZO HAVACILIK','Havacılık','✈️'],['ZAZO UZAY','Uzay','🚀'],['ZAZO ENERJİ','Enerji','⚡'],['ZAZO MADENCİLİK','Madencilik','⛏️']];
function fresh(){return{holding:320400000,day:287,current:0,companies:defs.map((d,i)=>({name:d[0],sector:d[1],icon:d[2],cash:125000000+i*8e6,value:1.25e9+i*145e6,revenue:78.45e6+i*5e6,profit:12.48e6+i*8e5,level:3+i%3,staff:286+i*20,manager:i===0,raw:{pamuk:0,iplik:0,kumas:0},warehouse:{tisort:0,gomlek:0,pantolon:0},store:{tisort:0,gomlek:0,pantolon:0},totals:{sales:0,cost:0,holding:0},logs:[]}))}}let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}const c=()=>S.companies[S.current],money=n=>'₺'+Math.round(n||0).toLocaleString('tr-TR'),save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const rawP={pamuk:28.5,iplik:41.2,kumas:62.4},rec={tisort:{n:'Tişört',need:{pamuk:2,iplik:1},cost:18,sell:190},gomlek:{n:'Gömlek',need:{kumas:2,iplik:1},cost:28,sell:310},pantolon:{n:'Pantolon',need:{kumas:3,iplik:1},cost:38,sell:420}};
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>e.style.display='none',1800)}function rows(a){return a.map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}function modal(t,d,b){mt.textContent=t;md.textContent=d;mb.innerHTML=b;document.querySelector('#modal').classList.add('open')}
function render(){let x=c();holding.textContent=money(S.holding);group.textContent=money(S.companies.reduce((a,b)=>a+b.value,0));day.textContent=S.day;name.textContent=x.name;sub.textContent=x.sector+' • Seviye '+x.level+' • '+(x.level>=5?'AŞ':'LTD')+' • Müdür '+(x.manager?'Aktif':'Yok');stats.innerHTML=[['Şirket Değeri',money(x.value)],['Şirket Kasası',money(x.cash)],['Aylık Ciro',money(x.revenue)],['Net Kâr',money(x.profit)]].map(a=>'<div class="mini"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join('');companies.innerHTML=S.companies.map((q,i)=>'<button class="company '+(i===S.current?'active':'')+'" data-c="'+i+'"><i>'+q.icon+'</i><b>'+q.name+'</b><small>'+money(q.cash)+'</small></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.current=+b.dataset.c;save();render();toast(c().name+' kampüsüne girildi')});world.style.backgroundImage=S.current===0?"linear-gradient(90deg,#020b12c0,transparent 30%,transparent 75%,#020b1260),url('campus.png')":"radial-gradient(circle at 60% 20%,#4b7187,#18384a 38%,#06131c 82%)";}
const navs=[['🏢','Şirketler'],['🏦','Banka'],['📈','Yatırım'],['🛒','Pazar'],['🚚','Araçlar'],['♛','Holding'],['📊','Raporlar'],['🏆','Başarılar'],['⚙️','Ayarlar']];nav.innerHTML=navs.map(n=>'<button class="nav" data-n="'+n[1]+'">'+n[0]+'<span>'+n[1]+'</span></button>').join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>openNav(b.dataset.n));
function openNav(n){let x=c();if(n==='Holding')modal('♛ ZAZO HOLDİNG','Grubun finans merkezi.',rows([['Holding Sermayesi',money(S.holding)],['Grup Değeri',money(S.companies.reduce((a,b)=>a+b.value,0))],['Toplam Şirket Kasası',money(S.companies.reduce((a,b)=>a+b.cash,0))],['Şirket',S.companies.length]]));else if(n==='Banka')modal('🏦 ZAZO BANK','Kredi ve finansman merkezi.',rows([['Şirket Kasası',money(x.cash)],['Kredi Limiti',money(x.value*.12)],['Mevcut Borç',money(0)]])+'<button class="action" id="loan">₺5.000.000 Kredi Çek</button>');else if(n==='Raporlar')modal('📊 GRUP RAPORU','Tüm şirketlerin performansı.',rows(S.companies.map(q=>[q.name,money(q.profit)+' kâr'])));else modal(n,'Oyun yönetim merkezi.',rows([['Seçili Şirket',x.name],['Şirket Değeri',money(x.value)],['Durum','Aktif']]));setTimeout(()=>{let l=document.querySelector('#loan');if(l)l.onclick=()=>{x.cash+=5e6;save();render();document.querySelector('#modal').classList.remove('open');toast('Kredi şirket kasasına geçti')}},0)}
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>area(b.dataset.area));function area(a){let x=c();if(S.current!==0){if(a==='office')return modal(x.name+' — Yönetim','Şirket merkez ofisi.',rows([['Seviye',x.level],['Çalışan',x.staff],['Kasa',money(x.cash)],['Değer',money(x.value)]])+'<button class="action" id="up">Merkezi Yükselt — '+money(x.level*5e6)+'</button>');return modal(x.name+' — '+a.toUpperCase(),x.sector+' operasyon sahası.',rows([['Durum','Aktif'],['Verimlilik','%91'],['Tesis Seviyesi',x.level],['Aylık Kâr',money(x.profit)]]))}
if(a==='office')return modal('🏢 ZAZO TEKSTİL — Merkez Ofis','Şirket yönetimi ve müdür otomasyonu.',rows([['Çalışan',x.staff],['Müdür',x.manager?'Aktif':'Yok'],['Şirket Kasası',money(x.cash)],['Şirket Değeri',money(x.value)]])+'<button class="action" id="mgr">'+(x.manager?'Müdürü Kapat':'Müdür İşe Al')+'</button>');
if(a==='factory')return factory();if(a==='warehouse')return warehouse();if(a==='store')return store();}
function factory(){let x=c();modal('🏭 ZAZO TEKSTİL — FABRİKA','Hammadde al ve gerçek ürün üret.','<div class="cols"><div class="box"><h3>Hammadde Pazarı</h3>'+rows(Object.entries(rawP).map(([k,v])=>[k.toUpperCase(),money(v)]))+'<div class="form"><select id="rt"><option value="pamuk">Pamuk</option><option value="iplik">İplik</option><option value="kumas">Kumaş</option></select><input id="rq" type="number" min="1" value="100"><button class="action" id="buy">Satın Al</button></div></div><div class="box"><h3>Üretim Hattı</h3>'+rows(Object.entries(rec).map(([k,r])=>[r.n,Object.entries(r.need).map(z=>z[1]+' '+z[0]).join(' + ')]))+'<div class="form"><select id="pt">'+Object.entries(rec).map(([k,r])=>'<option value="'+k+'">'+r.n+'</option>').join('')+'</select><input id="pq" type="number" min="1" value="10"><button class="action" id="prod">Üret</button></div></div></div>');setTimeout(bind,0)}
function warehouse(){let x=c();modal('📦 ZAZO TEKSTİL — DEPO','Gerçek stok ve mağazaya sevkiyat.','<div class="cols"><div class="box"><h3>Hammadde</h3>'+rows(Object.entries(x.raw).map(([k,v])=>[k.toUpperCase(),v]))+'</div><div class="box"><h3>Ürün Stoku</h3>'+rows(Object.entries(x.warehouse).map(([k,v])=>[rec[k].n,v]))+'<div class="form"><select id="st">'+Object.entries(rec).map(([k,r])=>'<option value="'+k+'">'+r.n+'</option>').join('')+'</select><input id="sq" type="number" value="10" min="1"><button class="action" id="ship">Sevk Et</button></div></div></div>');setTimeout(bind,0)}
function store(){let x=c();modal('🏪 ZAZO TEKSTİL — MAĞAZA','Mağaza içi gerçek stok ve satış.','<div class="cols"><div class="box"><h3>Mağaza Stoku</h3>'+rows(Object.entries(x.store).map(([k,v])=>[rec[k].n,v]))+'</div><div class="box"><h3>Satış</h3><div class="form"><select id="sat">'+Object.entries(rec).map(([k,r])=>'<option value="'+k+'">'+r.n+' • '+money(r.sell)+'</option>').join('')+'</select><input id="saq" type="number" value="5" min="1"><button class="action" id="sell">Sat</button></div>'+rows([['Toplam Satış',money(x.totals.sales)],['Toplam Maliyet',money(x.totals.cost)],['Holding Payı',money(x.totals.holding)]])+'</div></div>');setTimeout(bind,0)}
function bind(){let x=c(),b;if(b=document.querySelector('#buy'))b.onclick=()=>{let t=rt.value,q=Math.max(1,Math.floor(+rq.value||0)),cost=rawP[t]*q;if(x.cash<cost)return toast('Kasa yetersiz');x.cash-=cost;x.raw[t]+=q;x.totals.cost+=cost;save();render();factory();toast('Hammadde alındı')};if(b=document.querySelector('#prod'))b.onclick=()=>{let t=pt.value,q=Math.max(1,Math.floor(+pq.value||0)),r=rec[t];for(let k in r.need)if(x.raw[k]<r.need[k]*q)return toast('Hammadde yetersiz');let cost=r.cost*q;if(x.cash<cost)return toast('Kasa yetersiz');for(let k in r.need)x.raw[k]-=r.need[k]*q;x.cash-=cost;x.totals.cost+=cost;x.warehouse[t]+=q;save();render();factory();toast('Üretim tamamlandı')};if(b=document.querySelector('#ship'))b.onclick=()=>{let t=st.value,q=Math.max(1,Math.floor(+sq.value||0));if(x.warehouse[t]<q)return toast('Depoda ürün yok');let cost=q*4;x.warehouse[t]-=q;x.store[t]+=q;x.cash-=cost;x.totals.cost+=cost;save();render();warehouse();toast('Mağazaya sevk edildi')};if(b=document.querySelector('#sell'))b.onclick=()=>{let t=sat.value,q=Math.min(Math.max(1,Math.floor(+saq.value||0)),x.store[t]);if(!q)return toast('Mağaza stoğu yok');let rev=rec[t].sell*q,profit=Math.max(0,(rec[t].sell-rec[t].cost)*q),h=Math.round(profit*.2);x.store[t]-=q;x.cash+=rev-h;S.holding+=h;x.totals.sales+=rev;x.totals.holding+=h;save();render();store();toast('Satış yapıldı')}}document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('open');document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.querySelector('#reset').onclick=()=>{if(!confirm('Tüm ZAZO TYCOON verileri silinsin mi?'))return;Object.keys(localStorage).filter(k=>k.toLowerCase().includes('zazo')).forEach(k=>localStorage.removeItem(k));S=fresh();save();render();toast('Oyun tamamen sıfırlandı')};render();
</script></body></html>
