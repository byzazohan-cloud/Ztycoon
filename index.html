<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAZO TYCOON — Business Empire</title><style>
*{box-sizing:border-box}:root{--gold:#e6ba52;--gold2:#ffe19a;--ink:#040b11;--panel:#071824;--panel2:#0b2432;--text:#f2f6f8;--muted:#9ab0ba;--ok:#5be08d}
body{margin:0;background:#030a10;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit;color:inherit}.game{max-width:1600px;margin:auto;min-height:100vh;background:#06131c}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 13px;background:#06131d;border-bottom:1px solid #85672e;position:sticky;top:0;z-index:20}.brand{font-size:21px;font-weight:950;color:var(--gold2)}.brand small{display:block;font-size:8px;letter-spacing:3px;color:#9db0b9}.topstats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.chip{background:#0b2230;border:1px solid #435a66;border-radius:9px;padding:8px 10px}.chip b{color:var(--gold2)}button{cursor:pointer}.danger{border-color:#814646;color:#ffbcbc}.shell{display:grid;grid-template-columns:175px minmax(0,1fr)}aside{padding:8px;background:#071722;border-right:1px solid #80632d}.nav{display:grid;gap:7px}.nav button,.sector,.facility,.action{border:1px solid #65532d;background:linear-gradient(145deg,#091a25,#102a39);border-radius:10px;padding:10px}.nav button{text-align:left}.nav button.active,.nav button:hover,.sector.active,.facility:hover{border-color:var(--gold2);background:linear-gradient(90deg,#684914,#102a39)}
main{min-width:0}.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px}.head h1{margin:0;color:var(--gold2);font-size:25px}.head p{margin:3px 0;color:var(--muted)}.head .right{margin-left:auto}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:0 12px 9px}.stat{background:#0a202c;border:1px solid #294653;border-radius:9px;padding:9px}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold2);margin-top:4px}
.world{height:470px;margin:0 12px;position:relative;overflow:hidden;border:1px solid #8c6e31;border-radius:14px;background:radial-gradient(circle at 55% 20%,#567a8f,#1a394a 40%,#071722 85%)}.world.textile{background:url('textile-campus.png') center/cover no-repeat}.world:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#031019c9 0,transparent 33%),linear-gradient(90deg,#0310198a,transparent 28%,transparent 72%,#03101965);pointer-events:none}.fakeBuilding{position:absolute;left:23%;right:18%;bottom:18%;height:62%;background:linear-gradient(90deg,#17313e,#4b6572,#142d39);border:2px solid #82939b;border-radius:10px 10px 0 0}.textile .fakeBuilding{display:none}.fakeBuilding:after{content:"";position:absolute;inset:12px;background-image:linear-gradient(#f0ce7744 1px,transparent 1px),linear-gradient(90deg,#f0ce7733 1px,transparent 1px);background-size:30px 22px}.sign{position:absolute;z-index:2;left:0;right:0;top:40%;text-align:center;color:var(--gold2);font-size:31px;font-weight:950}.sceneInfo{position:absolute;z-index:3;left:14px;top:14px;background:#05131ddd;border:1px solid #8b6f34;border-radius:10px;padding:10px}.sceneInfo b{color:var(--gold2)}.hotspots{position:absolute;z-index:4;inset:0}.hot{position:absolute;background:#06131ddd;border:1px solid #e3b94f;border-radius:9px;padding:8px 10px;font-weight:800}.hot small{display:block;font-size:9px;color:#b3c4cb}.h-office{left:28%;top:47%}.h-factory{right:24%;top:46%}.h-depot{right:12%;top:65%}.h-store{left:47%;top:68%}
.facilities{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;padding:9px 12px}.facility{text-align:center}.facility span{display:block;font-size:22px}.facility small{display:block;color:var(--muted);font-size:10px}.sectorsWrap{border-top:1px solid #80632d;padding:9px 12px}.sectorTitle{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}.sectorTitle b{color:var(--gold2)}.sectors{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sector{text-align:left}.sector i{font-style:normal;font-size:20px}.sector b{display:block;font-size:12px}.sector small{color:var(--muted);font-size:10px}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:80;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalbox{width:min(900px,100%);max-height:88vh;overflow:auto;background:#091f2b;border:1px solid #9c7b35;border-radius:15px;padding:15px}.close{float:right;background:#142d3a;border:1px solid #526a75;border-radius:8px;padding:7px 10px}.modalbox h2{margin:0 0 4px;color:var(--gold2)}.desc{color:var(--muted);margin-bottom:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{background:#061822;border:1px solid #294652;border-radius:10px;padding:11px}.panel h3{color:var(--gold2);margin:0 0 9px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px;border-bottom:1px solid #1c3541}.row:last-child{border:0}.form{display:grid;grid-template-columns:1fr 100px auto;gap:7px;margin-top:9px}.form input,.form select{min-width:0;background:#04131b;border:1px solid #435b66;border-radius:8px;padding:9px}.action{color:#fff0b9;font-weight:800}.log{max-height:230px;overflow:auto}.log div{font-size:12px;padding:6px;border-bottom:1px solid #1b333e}.toast{display:none;position:fixed;right:14px;bottom:14px;z-index:100;background:#102b38;border:1px solid #9c7c38;border-radius:9px;padding:10px 13px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.facilities{grid-template-columns:repeat(4,1fr)}.sectors{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #80632d}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;font-size:10px;padding:8px 2px}.stats{grid-template-columns:repeat(2,1fr)}.world{height:390px}.facilities{grid-template-columns:repeat(2,1fr)}.sectors{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.form{grid-template-columns:1fr 85px}.form .action{grid-column:1/-1}.topstats{margin-left:0}.head h1{font-size:21px}}
</style></head><body><div class="game"><header class="top"><div class="brand">♛ ZAZO TYCOON<small>BUSINESS EMPIRE</small></div><div class="topstats"><div class="chip">Holding <b id="holding"></b></div><div class="chip">Grup Değeri <b id="group"></b></div><div class="chip">Gün <b id="day"></b></div><button class="chip danger" id="reset">↻ Verileri Sıfırla</button></div></header>
<div class="shell"><aside><div class="nav" id="nav"></div></aside><main><div class="head"><div><h1 id="name"></h1><p id="sub"></p></div><div class="right chip">🌍 İhracat <b id="exports"></b> • 👔 Müdür <b id="mgrTop"></b></div></div><div class="stats" id="stats"></div>
<section class="world textile" id="world"><div class="fakeBuilding"><div class="sign" id="sign"></div></div><div class="sceneInfo"><b id="sceneName"></b><div id="sceneSub"></div></div><div class="hotspots"><button class="hot h-office" data-hot="office">🏢 OFİS<small>Yönetim</small></button><button class="hot h-factory" data-hot="factory">🏭 FABRİKA<small>Üretim</small></button><button class="hot h-depot" data-hot="warehouse">📦 DEPO<small>Stok</small></button><button class="hot h-store" data-hot="store">🏪 MAĞAZA<small>Satış</small></button></div></section><div class="facilities" id="facilities"></div></main></div>
<section class="sectorsWrap"><div class="sectorTitle"><b>ŞİRKET DÜNYALARI</b><span style="color:var(--muted);font-size:11px">Her sektör ayrı şirket ve ekonomi</span></div><div class="sectors" id="sectors"></div></section></div>
<div class="modal" id="modal"><div class="modalbox"><button class="close" id="close">✕</button><h2 id="mt"></h2><div class="desc" id="md"></div><div id="mb"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='zazoPlanEditionV1';const defs=[['ZAZO TEKSTİL','Tekstil','🧵','150.000 adet/ay',12],['ZAZO İNŞAAT','İnşaat','🏗️','8 proje',4],['ZAZO GIDA','Gıda','🥫','220.000 ürün/ay',9],['ZAZO OTOMOTİV','Otomotiv','🚗','1.800 araç/ay',16],['ZAZO TEKNOLOJİ','Teknoloji','💻','85.000 cihaz/ay',21],['ZAZO LOJİSTİK','Lojistik','🚚','96 araç',14],['ZAZO HAVACILIK','Havacılık','✈️','14 uçak',19],['ZAZO UZAY','Uzay','🚀','3 görev/yıl',7],['ZAZO ENERJİ','Enerji','⚡','480 MW',11],['ZAZO MADENCİLİK','Madencilik','⛏️','72.000 ton/ay',8]];
function fresh(){return{holding:320400000,day:287,current:0,bankDebt:0,deposit:0,invest:{gold:0,stock:0,crypto:0},companies:defs.map((d,i)=>({name:d[0],sector:d[1],icon:d[2],capacity:d[3],exports:d[4],cash:125e6+i*9e6,value:1.25e9+i*155e6,revenue:78.45e6+i*5.2e6,profit:12.48e6+i*9e5,level:3+i%3,staff:286+i*22,stores:4+i%6,vehicles:8+i*3,manager:i===0,raw:{pamuk:0,iplik:0,kumas:0},warehouse:{tisort:0,gomlek:0,pantolon:0},store:{tisort:0,gomlek:0,pantolon:0},totals:{sales:0,raw:0,prod:0,salary:0,logistics:0,holding:0},logs:[]}))}}let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const c=()=>S.companies[S.current],money=n=>'₺'+Math.round(Number(n)||0).toLocaleString('tr-TR'),save=()=>localStorage.setItem(KEY,JSON.stringify(S));const rawP={pamuk:28.5,iplik:41.2,kumas:62.4},rec={tisort:{n:'Tişört',need:{pamuk:2,iplik:1},prod:18,sell:190},gomlek:{n:'Gömlek',need:{kumas:2,iplik:1},prod:28,sell:310},pantolon:{n:'Pantolon',need:{kumas:3,iplik:1},prod:38,sell:420}};
const facilities=[['🏢','Ofis','office'],['🏭','Fabrika','factory'],['📦','Depo','warehouse'],['🏪','Mağaza','store'],['🚚','Araçlar','fleet'],['👥','Çalışanlar','staff'],['📊','Raporlar','reports'],['💰','Finans','finance']];const navs=[['🏙️','Ana Şehir','city'],['🏢','Şirketler','companies'],['🏦','Banka','bank'],['📈','Yatırım','invest'],['🛒','Pazar','market'],['🚚','Araçlar','vehicles'],['♛','Holding','holding'],['📊','Raporlar','groupreports'],['🏆','Başarılar','achievements'],['⚙️','Ayarlar','settings']];
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1900)}function rows(a){return a.map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}function modal(t,d,b){mt.textContent=t;md.textContent=d||'';mb.innerHTML=b;modalEl.classList.add('open')}const modalEl=document.querySelector('#modal');
function render(){let x=c();holding.textContent=money(S.holding);group.textContent=money(S.companies.reduce((a,b)=>a+b.value,0));day.textContent=S.day;name.textContent=x.name;sub.textContent=x.sector+' • Seviye '+x.level+' • '+(x.level>=5?'AŞ':'LTD');exports.textContent=x.exports+' ülke';mgrTop.textContent=x.manager?'Aktif':'Yok';sceneName.textContent=x.name;sceneSub.textContent=x.sector+' kampüsü • '+x.capacity;sign.textContent=x.name;world.className='world '+(S.current===0?'textile':'');stats.innerHTML=[['Şirket Değeri',money(x.value)],['Şirket Kasası',money(x.cash)],['Aylık Ciro',money(x.revenue)],['Aylık Net Kâr',money(x.profit)],['Çalışan',x.staff],['Kapasite',x.capacity]].map(a=>'<div class="stat"><small>'+a[0]+'</small><b>'+a[1]+'</b></div>').join('');facilitiesEl.innerHTML=facilities.map(f=>'<button class="facility" data-f="'+f[2]+'"><span>'+f[0]+'</span><b>'+f[1]+'</b><small>İçeri gir</small></button>').join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>openFacility(b.dataset.f));sectors.innerHTML=S.companies.map((q,i)=>'<button class="sector '+(i===S.current?'active':'')+'" data-c="'+i+'"><i>'+q.icon+'</i><b>'+q.name+'</b><small>'+q.sector+' • '+money(q.cash)+'</small></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.current=+b.dataset.c;save();render();toast(c().name+' dünyasına girildi')})}const facilitiesEl=document.querySelector('#facilities');
nav.innerHTML=navs.map(n=>'<button data-n="'+n[2]+'">'+n[0]+' '+n[1]+'</button>').join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>openNav(b.dataset.n));document.querySelectorAll('[data-hot]').forEach(b=>b.onclick=()=>openFacility(b.dataset.hot));
function openFacility(t){let x=c();if(S.current===0&&t==='factory')return textileFactory();if(S.current===0&&t==='warehouse')return textileWarehouse();if(S.current===0&&t==='store')return textileStore();if(t==='office')return office();if(t==='staff')return staff();if(t==='reports')return report();if(t==='finance')return finance();let label=facilities.find(f=>f[2]===t)?.[1]||t;modal(x.name+' — '+label,x.sector+' sektörüne özel operasyon merkezi.','<div class="cols"><div class="panel"><h3>Operasyon</h3>'+rows([['Kapasite',x.capacity],['Verimlilik','%91'],['Tesis Seviyesi',x.level],['Durum','Aktif']])+'</div><div class="panel"><h3>Geliştirme</h3><button class="action" id="upgrade">⬆ Tesisi Yükselt — '+money(x.level*5e6)+'</button></div></div>');setTimeout(()=>{let b=document.querySelector('#upgrade');if(b)b.onclick=()=>{let cost=x.level*5e6;if(x.cash<cost)return toast('Şirket kasası yetersiz');x.cash-=cost;x.value+=cost*1.3;x.level++;x.profit+=450000;x.logs.push('Gün '+S.day+' • Tesis yükseltildi');save();render();modalEl.classList.remove('open');toast('Tesis yükseltildi')}},0)}
function office(){let x=c();modal(x.name+' — Merkez Ofis','Şirket yönetimi, seviye ve müdür kontrolü.','<div class="cols"><div class="panel"><h3>Şirket</h3>'+rows([['Seviye',x.level],['Çalışan',x.staff],['Mağaza/Tesis',x.stores],['Araç',x.vehicles],['Şirket Değeri',money(x.value)]])+'</div><div class="panel"><h3>Müdür</h3>'+rows([['Durum',x.manager?'Aktif':'Yok'],['Otomasyon',x.manager?'Açık':'Kapalı']])+'<button class="action" id="mgr">'+(x.manager?'Otomasyonu Kapat':'Müdür İşe Al — '+money(250000))+'</button></div></div>');setTimeout(()=>{let b=document.querySelector('#mgr');if(b)b.onclick=()=>{if(!x.manager&&x.cash<250000)return toast('Kasa yetersiz');if(!x.manager)x.cash-=250000;x.manager=!x.manager;save();render();office()}},0)}
function textileFactory(){let x=c();modal('ZAZO TEKSTİL — ÜRETİM','Hammadde → üretim → gerçek stok.','<div class="cols"><div class="panel"><h3>Hammadde Pazarı</h3>'+rows(Object.entries(rawP).map(([k,v])=>[k.toUpperCase(),money(v)+'/birim']))+'<div class="form"><select id="rt"><option value="pamuk">Pamuk</option><option value="iplik">İplik</option><option value="kumas">Kumaş</option></select><input id="rq" type="number" min="1" value="100"><button class="action" id="buy">Satın Al</button></div></div><div class="panel"><h3>Üretim Hattı</h3>'+rows(Object.entries(rec).map(([k,r])=>[r.n,Object.entries(r.need).map(a=>a[1]+' '+a[0]).join(' + ')]))+'<div class="form"><select id="pt">'+Object.entries(rec).map(([k,r])=>'<option value="'+k+'">'+r.n+'</option>').join('')+'</select><input id="pq" type="number" min="1" value="10"><button class="action" id="prod">Üret</button></div></div></div>');setTimeout(bindTextile,0)}
function textileWarehouse(){let x=c();modal('ZAZO TEKSTİL — DEPO','Stok girişi, ürün deposu ve mağazaya sevkiyat.','<div class="cols"><div class="panel"><h3>Hammadde</h3>'+rows(Object.entries(x.raw).map(([k,v])=>[k.toUpperCase(),v]))+'</div><div class="panel"><h3>Ürün Deposu</h3>'+rows(Object.entries(x.warehouse).map(([k,v])=>[rec[k].n,v]))+'<div class="form"><select id="st">'+Object.entries(rec).map(([k,r])=>'<option value="'+k+'">'+r.n+'</option>').join('')+'</select><input id="sq" type="number" min="1" value="10"><button class="action" id="ship">Sevk Et</button></div></div></div>');setTimeout(bindTextile,0)}
function textileStore(){let x=c();modal('ZAZO TEKSTİL — MAĞAZA','Talep, stok ve gerçek satış.','<div class="cols"><div class="panel"><h3>Mağaza Stoku</h3>'+rows(Object.entries(x.store).map(([k,v])=>[rec[k].n,v]))+'</div><div class="panel"><h3>Satış</h3><div class="form"><select id="sat">'+Object.entries(rec).map(([k,r])=>'<option value="'+k+'">'+r.n+' • '+money(r.sell)+'</option>').join('')+'</select><input id="saq" type="number" min="1" value="5"><button class="action" id="sell">Sat</button></div>'+rows([['Toplam Satış',money(x.totals.sales)],['Holding Aktarımı',money(x.totals.holding)]])+'</div></div>');setTimeout(bindTextile,0)}
function bindTextile(){let x=c(),b;if(b=document.querySelector('#buy'))b.onclick=()=>{let t=rt.value,q=Math.max(1,Math.floor(+rq.value||0)),cost=rawP[t]*q;if(x.cash<cost)return toast('Kasa yetersiz');x.cash-=cost;x.raw[t]+=q;x.totals.raw+=cost;x.logs.push('Gün '+S.day+' • '+q+' '+t+' alındı');save();render();textileFactory()};if(b=document.querySelector('#prod'))b.onclick=()=>{let t=pt.value,q=Math.max(1,Math.floor(+pq.value||0)),r=rec[t];for(let k in r.need)if(x.raw[k]<r.need[k]*q)return toast('Hammadde yetersiz');let cost=r.prod*q;if(x.cash<cost)return toast('Kasa yetersiz');for(let k in r.need)x.raw[k]-=r.need[k]*q;x.cash-=cost;x.totals.prod+=cost;x.warehouse[t]+=q;x.logs.push('Gün '+S.day+' • '+q+' '+r.n+' üretildi');save();render();textileFactory()};if(b=document.querySelector('#ship'))b.onclick=()=>{let t=st.value,q=Math.max(1,Math.floor(+sq.value||0));if(x.warehouse[t]<q)return toast('Depoda ürün yetersiz');let cost=q*4;x.warehouse[t]-=q;x.store[t]+=q;x.cash-=cost;x.totals.logistics+=cost;x.logs.push('Gün '+S.day+' • '+q+' '+rec[t].n+' sevk edildi');save();render();textileWarehouse()};if(b=document.querySelector('#sell'))b.onclick=()=>{let t=sat.value,q=Math.min(Math.max(1,Math.floor(+saq.value||0)),x.store[t]);if(!q)return toast('Mağaza stoğu yok');let rev=rec[t].sell*q,profit=Math.max(0,(rec[t].sell-rec[t].prod)*q),h=Math.round(profit*.2);x.store[t]-=q;x.cash+=rev-h;S.holding+=h;x.totals.sales+=rev;x.totals.holding+=h;x.logs.push('Gün '+S.day+' • '+q+' '+rec[t].n+' satıldı • '+money(rev));save();render();textileStore()}}
function staff(){let x=c();modal(x.name+' — Çalışanlar','Personel ve otomasyon.',rows([['Çalışan',x.staff],['Müdür',x.manager?'Aktif':'Yok'],['Aylık Maaş',money(x.staff*28500)],['Verimlilik','%89']]))}function report(){let x=c();modal(x.name+' — Raporlar','Şirket gelir, gider ve işlem geçmişi.','<div class="cols"><div class="panel"><h3>Finans</h3>'+rows([['Aylık Ciro',money(x.revenue)],['Aylık Kâr',money(x.profit)],['Gerçek Satış',money(x.totals.sales)],['Hammadde',money(x.totals.raw)],['Üretim',money(x.totals.prod)],['Lojistik',money(x.totals.logistics)],['Holding Payı',money(x.totals.holding)]])+'</div><div class="panel"><h3>Geçmiş</h3><div class="log">'+(x.logs.length?x.logs.slice().reverse().map(l=>'<div>'+l+'</div>').join(''):'Henüz işlem yok.')+'</div></div></div>')}function finance(){let x=c();modal(x.name+' — Finans','Şirket ve Holding finans özeti.',rows([['Şirket Kasası',money(x.cash)],['Şirket Değeri',money(x.value)],['Holding Sermayesi',money(S.holding)],['Holding Payı',money(x.totals.holding)]]))}
function openNav(t){let x=c();if(t==='holding')return modal('♛ ZAZO HOLDİNG','Tüm grubun konsolide finans merkezi.',rows([['Holding Sermayesi',money(S.holding)],['Grup Değeri',money(S.companies.reduce((a,b)=>a+b.value,0))],['Şirket Kasaları',money(S.companies.reduce((a,b)=>a+b.cash,0))],['Şirket Sayısı',S.companies.length]]));if(t==='bank')return modal('🏦 BANKA','Kredi, mevduat ve finansman.',rows([['Mevduat',money(S.deposit)],['Borç',money(S.bankDebt)],['Kredi Limiti',money(x.value*.12)]])+'<button class="action" id="loan">₺5.000.000 Kredi Çek</button>');if(t==='invest')return modal('📈 YATIRIM MERKEZİ','Hisse, kripto, altın ve gümüş.',rows([['Altın',S.invest.gold+' birim'],['Hisse',S.invest.stock+' lot'],['Kripto',S.invest.crypto+' birim']]));if(t==='groupreports')return modal('📊 HOLDİNG RAPORU','Şirket bazlı performans.',rows(S.companies.map(q=>[q.name,money(q.profit)+' kâr'])));if(t==='city')return modal('🏙️ ANA ŞEHİR','Banka, yatırım merkezi, Holding ve şirket dünyalarına açılan ana merkez.','<img src="game-plan.png" alt="ZAZO TYCOON oyun planı" style="width:100%;border-radius:10px;border:1px solid #465b66">');modal(navs.find(n=>n[2]===t)?.[1]||t,'Oyun sistemi.',rows([['Seçili Şirket',x.name],['Durum','Aktif'],['Gün',S.day]]));setTimeout(()=>{let b=document.querySelector('#loan');if(b)b.onclick=()=>{S.bankDebt+=5e6;x.cash+=5e6;save();render();modalEl.classList.remove('open');toast('Kredi şirket kasasına geçti')}},0)}
document.querySelector('#close').onclick=()=>modalEl.classList.remove('open');modalEl.onclick=e=>{if(e.target===modalEl)modalEl.classList.remove('open')};document.querySelector('#reset').onclick=()=>{if(!confirm('Tüm ZAZO TYCOON oyun verileri silinsin mi?'))return;Object.keys(localStorage).filter(k=>k.toLowerCase().includes('zazo')).forEach(k=>localStorage.removeItem(k));S=fresh();save();render();toast('Oyun tamamen sıfırlandı')};
setInterval(()=>{S.day++;S.companies.forEach((x,i)=>{if(x.manager){let salary=Math.round(x.staff*900);if(x.cash>salary){x.cash-=salary;x.totals.salary+=salary}if(i===0){if(x.raw.pamuk<250&&x.cash>17100){x.cash-=17100;x.raw.pamuk+=600;x.totals.raw+=17100}if(x.raw.iplik<150&&x.cash>16480){x.cash-=16480;x.raw.iplik+=400;x.totals.raw+=16480}let q=Math.min(50,Math.floor(x.raw.pamuk/2),x.raw.iplik);if(q>0){x.raw.pamuk-=q*2;x.raw.iplik-=q;x.cash-=q*18;x.totals.prod+=q*18;x.warehouse.tisort+=q}let sh=Math.min(40,x.warehouse.tisort);if(sh){x.warehouse.tisort-=sh;x.store.tisort+=sh;x.cash-=sh*4;x.totals.logistics+=sh*4}let sl=Math.min(30,x.store.tisort);if(sl){let rev=sl*190,h=Math.round(sl*(190-18)*.2);x.store.tisort-=sl;x.cash+=rev-h;S.holding+=h;x.totals.sales+=rev;x.totals.holding+=h}}else{let p=Math.round(x.profit/30*.02),h=Math.round(p*.2);x.cash+=p-h;S.holding+=h}}});save();render()},45000);render();
