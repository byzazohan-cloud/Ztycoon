<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>ZAZO TYCOON</title><style>
*{box-sizing:border-box}body{margin:0;background:#06101a;color:#eef4f7;font-family:Inter,Arial,sans-serif;overflow-x:hidden}.app{min-height:100vh;background:linear-gradient(90deg,rgba(3,11,18,.98) 0 205px,rgba(3,11,18,.2) 430px),linear-gradient(0deg,rgba(3,10,16,.95),transparent 42%),url('a_ultra_detailed_cinematic_high_resolution_ui_ty.png') center/cover fixed}.top{height:64px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(4,13,22,.92);border-bottom:1px solid #a77a25;position:sticky;top:0;z-index:10}.brand{font-family:Georgia;font-weight:800;color:#e8bd61;font-size:21px;min-width:190px}.pill{padding:9px 13px;background:#0a1c2b;border:1px solid #7e632f;border-radius:9px}.grow{flex:1}.gold{color:#efc66b}.green{color:#59e589}.sidebar{position:fixed;top:64px;bottom:0;width:205px;padding:12px;background:rgba(4,13,22,.94);border-right:1px solid #806126;z-index:8}.nav{display:block;width:100%;padding:13px 12px;margin:7px 0;border:1px solid #725b31;border-radius:9px;background:#0a1824;color:#fff;text-align:left;font-weight:700;cursor:pointer}.nav:hover,.nav.active{background:linear-gradient(90deg,#6b4a12,#152131);border-color:#efc66b}.main{margin-left:205px;padding:18px}.hero{min-height:520px;border:1px solid #9c7632;border-radius:15px;overflow:hidden;position:relative;background:linear-gradient(90deg,rgba(3,11,18,.78),rgba(3,11,18,.08)),url('a_ultra_detailed_cinematic_high_resolution_ui_ty.png') center/cover;box-shadow:0 18px 60px #0008}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#06101a 0%,transparent 42%);pointer-events:none}.company-title{position:relative;z-index:2;padding:28px}.company-title h1{font-family:Georgia;font-size:48px;margin:5px 0;color:#f3d28a;text-shadow:0 3px 20px #000}.company-title p{max-width:530px}.stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:0 22px}.card{background:rgba(5,20,31,.9);border:1px solid #8d6b2f;border-radius:11px;padding:13px;backdrop-filter:blur(8px)}.card small{color:#aebcc6}.card b{display:block;font-size:18px;margin-top:6px}.facilities{position:absolute;z-index:3;left:18px;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.facility{cursor:pointer;min-height:86px;text-align:center;background:rgba(5,18,28,.94);border:1px solid #8d6b2f;border-radius:10px;padding:12px 5px}.facility:hover{transform:translateY(-3px);border-color:#f2ca70}.facility .ico{font-size:25px}.companies{display:grid;grid-template-columns:repeat(10,minmax(120px,1fr));gap:9px;margin-top:14px;overflow:auto;padding-bottom:4px}.co{min-width:130px;background:#0a1824;border:1px solid #755c2f;border-radius:11px;padding:10px;cursor:pointer}.co.active{border:2px solid #f1c76c;background:#1d241f}.co b{display:block}.co small{color:#a9b6bf}.panel{margin-top:14px;display:grid;grid-template-columns:2fr 1fr;gap:14px}.log{max-height:190px;overflow:auto}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #233444}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(720px,92vw);max-height:80vh;overflow:auto;background:#081825;border:1px solid #c99a43;border-radius:14px;padding:20px}.close{float:right;background:#172838;color:#fff;border:1px solid #876a36;border-radius:8px;padding:8px 12px;cursor:pointer}@media(max-width:900px){.sidebar{width:72px}.nav{font-size:0;text-align:center}.nav:before{content:'◆';font-size:18px}.brand{min-width:auto;font-size:14px}.main{margin-left:72px}.stats{grid-template-columns:repeat(2,1fr)}.facilities{position:relative;left:auto;right:auto;bottom:auto;margin:150px 14px 14px;grid-template-columns:repeat(2,1fr)}.companies{grid-template-columns:repeat(10,140px)}.panel{grid-template-columns:1fr}.top .hide{display:none}.company-title h1{font-size:34px}}
</style></head><body><div class='app'><header class='top'><div class='brand'>♛ ZAZO TYCOON</div><div class='pill'>💵 <b id='cash'>₺125.430.000</b></div><div class='pill'>💎 1.250</div><div class='pill hide'>♛ Seviye 28</div><div class='grow'></div><div class='pill hide'>🏆 Başarılar</div><div class='pill'>⚙️</div></header><aside class='sidebar' id='nav'></aside><main class='main'><section class='hero' id='hero'><div class='company-title'><small class='gold'>ŞİRKET YÖNETİM MERKEZİ</small><h1 id='name'></h1><p id='desc'></p></div><div class='stats' id='stats'></div><div class='facilities' id='facilities'></div></section><section class='companies' id='companies'></section><section class='panel'><div class='card'><h3>📒 Canlı Şirket Hareketleri</h3><div class='log' id='log'></div></div><div class='card'><h3>♛ Holding</h3><div class='row'><span>Holding Sermayesi</span><b class='gold' id='holding'></b></div><div class='row'><span>Toplam Grup Değeri</span><b class='green' id='group'></b></div><div class='row'><span>Otomatik Kâr Payı</span><b>%20 net kâr</b></div></div></section></main></div><div class='modal' id='modal'><div class='modalbox'><button class='close' onclick='modal.classList.remove("show")'>Kapat</button><h2 id='modalTitle'></h2><div id='modalBody'></div></div></div><script>
const sectors=[['ZAZO TEKSTİL','Tekstil','🏭'],['ZAZO İNŞAAT','İnşaat','🏗️'],['ZAZO GIDA','Gıda','🥫'],['ZAZO OTOMOTİV','Otomotiv','🚗'],['ZAZO TEKNOLOJİ','Teknoloji','💻'],['ZAZO LOJİSTİK','Lojistik','🚚'],['ZAZO HAVACILIK','Havacılık','✈️'],['ZAZO UZAY','Uzay','🚀'],['ZAZO ENERJİ','Enerji','⚡'],['ZAZO MADENCİLİK','Madencilik','⛏️']];
let state=JSON.parse(localStorage.getItem('zazo_v1')||'null')||{active:0,holding:320400000,companies:sectors.map((s,i)=>({name:s[0],sector:s[1],ico:s[2],cash:25000000+i*3400000,value:180000000+i*47000000,revenue:7800000+i*610000,profit:1240000+i*95000,workers:45+i*17,stores:2+i%5,capacity:15000+i*9000,level:1+i%5,stock:2200+i*350})) ,logs:[]};
const fmt=n=>'₺'+Math.round(n).toLocaleString('tr-TR');const navs=['🏢 Şirketlerim','🏦 Banka','📈 Yatırım','🛒 Pazar','🚚 Araçlar','🏠 Gayrimenkul','♛ Holding','📊 Raporlar','🏆 Başarılar','⚙️ Ayarlar'];
nav.innerHTML=navs.map((x,i)=>`<button class='nav ${i==0?'active':''}' onclick='openMenu("${x}")'>${x}</button>`).join('');
const fac=[['🏢','Ofis'],['🏭','Fabrika'],['📦','Depo'],['🏪','Mağazalar'],['🚚','Araçlar'],['⚙️','Ürün Yönetimi'],['👥','Çalışanlar'],['📊','Finans']];
function render(){let c=state.companies[state.active];name.textContent=c.name;desc.textContent=`${c.sector} sektöründeki şirketini yönet, üretimi büyüt, mağazalarını geliştir ve holding değerini artır.`;stats.innerHTML=[['Şirket Değeri',fmt(c.value)],['Aylık Ciro',fmt(c.revenue)],['Aylık Net Kâr',fmt(c.profit)],['Çalışan',c.workers],['Mağaza',c.stores],['Üretim Kapasitesi',c.capacity.toLocaleString('tr-TR')+'/ay']].map(x=>`<div class='card'><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');facilities.innerHTML=fac.map(x=>`<div class='facility' onclick='openFacility("${x[1]}")'><div class='ico'>${x[0]}</div><b>${x[1]}</b><small>Seviye ${c.level}</small></div>`).join('');companies.innerHTML=state.companies.map((x,i)=>`<div class='co ${i==state.active?'active':''}' onclick='state.active=${i};render()'><div style='font-size:25px'>${x.ico}</div><b>${x.name}</b><small>Seviye ${x.level} · ${fmt(x.cash)}</small></div>`).join('');holding.textContent=fmt(state.holding);group.textContent=fmt(state.holding+state.companies.reduce((a,x)=>a+x.value,0));cash.textContent=fmt(state.companies.reduce((a,x)=>a+x.cash,0));log.innerHTML=(state.logs.length?state.logs:['Oyun ekonomisi çalışıyor…']).slice(-20).reverse().map(x=>`<div class='row'><span>${x}</span></div>`).join('');localStorage.setItem('zazo_v1',JSON.stringify(state))}
function openFacility(t){let c=state.companies[state.active];modalTitle.textContent=c.name+' · '+t;modalBody.innerHTML=`<div class='card'><h3>${t} Yönetimi</h3><p>Bu bölüm ${c.name} şirketinin gerçek verilerine bağlıdır.</p><div class='row'><span>Şirket Kasası</span><b>${fmt(c.cash)}</b></div><div class='row'><span>Stok</span><b>${c.stock.toLocaleString('tr-TR')} adet</b></div><div class='row'><span>Seviye</span><b>${c.level}</b></div><br><button class='nav' onclick='upgrade("${t}")'>⬆ ${t} Yükselt · ${fmt(c.level*250000)}</button></div>`;modal.classList.add('show')}
function upgrade(t){let c=state.companies[state.active],cost=c.level*250000;if(c.cash>=cost){c.cash-=cost;c.level++;c.capacity=Math.round(c.capacity*1.12);c.value+=cost*.8;state.logs.push(`${c.name}: ${t} Seviye ${c.level} oldu · -${fmt(cost)}`);render();openFacility(t)}}
function openMenu(t){modalTitle.textContent=t;let c=state.companies[state.active];modalBody.innerHTML=`<div class='card'><h3>${t}</h3><p>${t} sistemi çalışan ekonomi motoruna bağlıdır. Seçili şirket: <b>${c.name}</b>.</p><div class='row'><span>Şirket Kasası</span><b>${fmt(c.cash)}</b></div><div class='row'><span>Holding Sermayesi</span><b>${fmt(state.holding)}</b></div></div>`;modal.classList.add('show')}
setInterval(()=>{state.companies.forEach(c=>{let sale=Math.max(1000,Math.round(c.revenue/3000*(.65+Math.random()*.7)));let cost=sale*.58,profit=sale-cost;c.cash+=sale-cost;c.value+=profit*.05;c.stock=Math.max(0,c.stock-Math.ceil(sale/800));state.holding+=profit*.2;if(Math.random()<.16)state.logs.push(`${c.name}: satış +${fmt(sale)} · net ${fmt(profit)} · Holding ${fmt(profit*.2)}`)});render()},5000);render();
</script></body></html>
